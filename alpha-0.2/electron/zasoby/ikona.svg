<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Trzewia — ikona gry: płyta ryciny z ramą, przekrój góry z krzyżem na szczycie, złota droga wiernych
       i rozżarzony rdzeń w kręgu znaków (jak na frontyspisie menu). Barwy z palety gry (src/nastawy/barwy.ts). -->
  <defs>
    <radialGradient id="tlo" cx="50%" cy="30%" r="80%">
      <stop offset="0" stop-color="#3b261b"/>
      <stop offset="0.5" stop-color="#1b110d"/>
      <stop offset="1" stop-color="#0b0807"/>
    </radialGradient>
    <radialGradient id="switanie" cx="134" cy="66" r="92" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c49a50" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#76582f" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#76582f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rama" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b0603f"/>
      <stop offset="0.5" stop-color="#8a3324"/>
      <stop offset="1" stop-color="#5a2116"/>
    </linearGradient>
    <linearGradient id="skala" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8c7259"/>
      <stop offset="0.45" stop-color="#5e4734"/>
      <stop offset="1" stop-color="#2c1d15"/>
    </linearGradient>
    <linearGradient id="cienBoku" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.45"/>
    </linearGradient>
    <pattern id="kreska" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(-38)">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#160d09" stroke-width="1.3" stroke-opacity="0.7"/>
    </pattern>
    <linearGradient id="strona" x1="96" y1="0" x2="200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="cien"><rect x="0" y="0" width="256" height="256" fill="url(#strona)"/></mask>
    <linearGradient id="swiatloZbocza" x1="40" y1="60" x2="150" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e0a860" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#e0a860" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="komora" cx="128" cy="196" r="44" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5a1712"/>
      <stop offset="0.6" stop-color="#260b08"/>
      <stop offset="1" stop-color="#120605"/>
    </radialGradient>
    <radialGradient id="poswiata" cx="128" cy="196" r="78" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff8c32" stop-opacity="0.75"/>
      <stop offset="0.3" stop-color="#e2452c" stop-opacity="0.38"/>
      <stop offset="0.7" stop-color="#8a1a16" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#8a1a16" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rdzen" cx="0.4" cy="0.36" r="0.72">
      <stop offset="0" stop-color="#fff4dc"/>
      <stop offset="0.22" stop-color="#ffc277"/>
      <stop offset="0.55" stop-color="#ef5a32"/>
      <stop offset="1" stop-color="#8a1a16"/>
    </radialGradient>
    <filter id="blask" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <radialGradient id="winieta" cx="50%" cy="45%" r="72%">
      <stop offset="0.6" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.5"/>
    </radialGradient>
    <clipPath id="plyta"><rect x="12" y="12" width="232" height="232" rx="44"/></clipPath>
    <clipPath id="gora"><path id="obrysGory" d="M12 214 L40 172 L58 160 L76 136 L92 128 L104 140 L116 112 L130 62 L138 54 L148 72 L160 92 L172 98 L190 128 L204 140 L224 170 L244 190 L244 244 L12 244 Z"/></clipPath>
  </defs>

  <!-- płyta -->
  <rect x="8" y="8" width="240" height="240" rx="48" fill="#0b0807"/>
  <g clip-path="url(#plyta)">
    <rect x="0" y="0" width="256" height="256" fill="url(#tlo)"/>
    <circle cx="134" cy="66" r="92" fill="url(#switanie)"/>
    <!-- góra -->
    <use href="#obrysGory" fill="url(#skala)"/>
    <g clip-path="url(#gora)">
      <rect x="0" y="0" width="256" height="256" fill="url(#swiatloZbocza)"/>
      <rect x="0" y="0" width="256" height="256" fill="url(#kreska)" mask="url(#cien)"/>
      <rect x="0" y="0" width="256" height="256" fill="url(#cienBoku)"/>
      <!-- warstwy skały -->
      <path d="M20 168 Q70 160 120 166 T236 162" fill="none" stroke="#1f140e" stroke-width="2" stroke-opacity="0.6"/>
      <path d="M14 206 Q70 198 128 204 T246 200" fill="none" stroke="#1f140e" stroke-width="2" stroke-opacity="0.6"/>
      <!-- poświata rdzenia na skale -->
      <circle cx="128" cy="196" r="78" fill="url(#poswiata)"/>
    </g>
    <!-- obrys góry (rylec) -->
    <path d="M12 214 L40 172 L58 160 L76 136 L92 128 L104 140 L116 112 L130 62 L138 54 L148 72 L160 92 L172 98 L190 128 L204 140 L224 170 L244 190" fill="none" stroke="#e9dab7" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- krzyż na szczycie -->
    <g stroke="#efe3c6" stroke-width="3.4" stroke-linecap="round">
      <line x1="138" y1="52" x2="138" y2="26"/>
      <line x1="129" y1="34" x2="147" y2="34"/>
    </g>
    <rect x="0" y="0" width="256" height="256" fill="url(#winieta)"/>
    <!-- komora rdzenia: łuk krypty -->
    <path d="M86 244 V198 A42 42 0 0 1 170 198 V244 Z" fill="url(#komora)" stroke="#0e0605" stroke-width="3"/>
    <path d="M86 244 V198 A42 42 0 0 1 170 198 V244" fill="none" stroke="#c49a50" stroke-width="1.6" stroke-opacity="0.55"/>
    <!-- krąg znaków -->
    <g fill="#ff8c32">
      <circle cx="128" cy="196" r="31" fill="none" stroke="#ff8c32" stroke-width="1.2" stroke-opacity="0.45"/>
      <g id="znak"><rect x="126.2" y="160" width="3.6" height="7" rx="1"/></g>
      <use href="#znak" transform="rotate(30 128 196)"/><use href="#znak" transform="rotate(60 128 196)"/>
      <use href="#znak" transform="rotate(90 128 196)"/><use href="#znak" transform="rotate(120 128 196)"/>
      <use href="#znak" transform="rotate(150 128 196)"/><use href="#znak" transform="rotate(180 128 196)"/>
      <use href="#znak" transform="rotate(210 128 196)"/><use href="#znak" transform="rotate(240 128 196)"/>
      <use href="#znak" transform="rotate(270 128 196)"/><use href="#znak" transform="rotate(300 128 196)"/>
      <use href="#znak" transform="rotate(330 128 196)"/>
    </g>
    <!-- droga wiernych: od szczytu zygzakiem do rdzenia -->
    <path d="M136 70 L112 106 L150 134 L116 160 L128 176" fill="none" stroke="#ffb05a" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" stroke-opacity="0.35" filter="url(#blask)"/>
    <path d="M136 70 L112 106 L150 134 L116 160 L128 176" fill="none" stroke="#24140d" stroke-width="5.6" stroke-linejoin="round" stroke-linecap="round" stroke-opacity="0.5"/>
    <path d="M136 70 L112 106 L150 134 L116 160 L128 176" fill="none" stroke="#eab56a" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 4.5"/>
    <!-- rdzeń -->
    <circle cx="128" cy="196" r="24" fill="#ff8c32" fill-opacity="0.5" filter="url(#blask)"/>
    <polygon points="136.3,175.9 148.1,187.7 148.1,204.3 136.3,216.1 119.7,216.1 107.9,204.3 107.9,187.7 119.7,175.9" fill="url(#rdzen)" stroke="#fff0d0" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M129 178 L125 189 L131 196 L126 205 L129 214 M125 189 L116 192 L110 190 M131 196 L141 193 L146 197 M126 205 L119 208" fill="none" stroke="#6e1010" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.8"/>
    <polygon points="119.7,179.9 133,179.9 124,189 112,190" fill="#fffaf0" fill-opacity="0.55"/>
  </g>
  <!-- rama -->
  <rect x="12" y="12" width="232" height="232" rx="44" fill="none" stroke="url(#rama)" stroke-width="8"/>
  <rect x="19.5" y="19.5" width="217" height="217" rx="37" fill="none" stroke="#d4c6a6" stroke-width="1.5" stroke-opacity="0.35"/>
  <rect x="8.5" y="8.5" width="239" height="239" rx="47.5" fill="none" stroke="#0b0807" stroke-width="1.5"/>
</svg>
