go, zasypia w skale.",kiedy:"Rodzą się z szaleńców — przy karcie żyły szaleństwa „zostaw” daje nowych trolów, „zasklep” ich nie da.",rycina:Hi(R.TROLL,"stoi",.95)},{id:"rasa-3",grupa:"rasy",nazwa:"Prządki",lacina:"Textrices servorum",opis:"Nie podbijają — przejmują. Biorą słabszych w jarzmo, przerabiają cudze dzieci na swoje, a głodne wysysają tych, których wzięły. Rosną wyłącznie cudzym kosztem.",kiedy:"Potrzebują sąsiadów słabszych od siebie. Nakarm je, gdy głodują; gdy zaczną wojnę, karta „pierwsza krew” pozwoli ich rozdzielić.",rycina:Hi(R.SPINNER,"stoi",.8)},{id:"rasa-4",grupa:"rasy",nazwa:"Ludzie",lacina:"Advenae superni",opis:"Nie mieszkają w tobie. Schodzą z powierzchni po rudę i sławę, zabierają, co znajdą, i wracają na górę. Nie liczą się do wstęgi warstw.",kiedy:"Gdy przyjdzie karta najazdu: zawal wejście, wpuść ich albo poprowadź na najliczniejszych. Każda ich śmierć to twoja krew.",rycina:Hi(R.HUMAN,"idzie")},{id:"rasa-5",grupa:"rasy",nazwa:"Grzybnia",lacina:"Caro in fungum",opis:"Nie ma jednostek i nie czci cię wcale. Rośnie ze zwłok — każda śmierć to paliwo na kilka kafli. Obcym parzy stopy, Ślepemu Ludowi daje jeść.",kiedy:"Wyrasta sama po każdej rzezi. Gdzie jej za dużo, zmyje ją powódź z karty wydarzenia.",rycina:fd},{id:"ryt-zasiej",grupa:"ryty",nazwa:"Nakarm",lacina:"Semen causae",opis:"Nie rozkazujesz, dokąd iść — kładziesz w skale powód. Grzyb to jedzenie, ruda to materiał na ołtarze i kuźnie, kości są padliną, która też karmi.",kiedy:"Siej przy tych, których jest najmniej. Dosypywanie zwycięzcy przybliża sen.",koszt:`grzyb ${Fi("zasiej","grzyb")}, ruda ${Fi("zasiej","ruda")}`,rycina:Ra(or)},{id:"ryt-szept",grupa:"ryty",nazwa:"Szepnij",lacina:"Susurrus",opis:"Dotykasz jednej głowy. „Módl się” posyła go pod twój rdzeń: idzie tam jako wierny i modli się pod skorupą. „Prorokuj” odrywa go z garstką wiernych w nową nację.",kiedy:"Trzech wysłanych „módl się” wystarczy, żeby skorupa zaczęła pękać. Prorok rozbija nację, która zjada resztę.",koszt:`módl się ${Fi("szept","modl")}, prorok ${Fi("szept","prorok")}`,rycina:Ra(nr)},{id:"ryt-znak",grupa:"ryty",nazwa:"Cud",lacina:"Signum manifestum",opis:"Jawny cud widziany w promieniu dwudziestu sześciu kafli. Podnosi oddanie nacji i gasi strach. Zostaje świecący glif — modlitwa przy nim liczy się podwójnie.",kiedy:"Stawiaj przy gnieździe nacji, którą chcesz doprowadzić do rdzenia. Jedno, dwa objawienia i sama wyśle wartę.",koszt:Fi("znak","objawienie"),rycina:Ra(sr)},{id:"krew",grupa:"zasoby",nazwa:"Krew",lacina:"Sanguis",opis:"Liczba nad płytą i czerwona rysa pod nią. Płaci ci ją każda śmierć w twoich trzewiach — cudza wojna jest twoim dochodem. Mieści się jej najwyżej 250.",kiedy:"Wydajesz ją na jedzenie (ryt Nakarm) i na wybory na kartach wydarzeń.",rycina:Ra(Lt)},{id:"wiara",grupa:"zasoby",nazwa:"Wiara",lacina:"Fides",opis:"Liczba nad płytą — twój zapas. Rośnie za każdym razem, gdy ktoś się do ciebie modli: przy ołtarzu, kuźni, twoim Cudzie, a najmocniej pod rdzeniem. Mieści się jej najwyżej 200. Nie myl jej z oddaniem: Wiara to twoja waluta, oddanie to to, jak mocno wierzy nacja.",kiedy:"Płacisz nią za szept, Cud i wybory na kartach wydarzeń. Więcej w tablicy Oddanie i modlitwa.",rycina:Ra(Lt)},{id:"pamiec",grupa:"prawa",nazwa:"Pamięć",lacina:"Memoria",opis:"Widzisz siebie tylko tam, gdzie ktoś jest albo był. Gdzie nikt nie chodzi, rysunek blaknie i pokazuje stan sprzed pokoleń, a potem ciemność.",kiedy:"Im dalej chodzą twoi mieszkańcy, tym więcej o sobie widzisz.",rycina:Ra(tr)},{id:"sen",grupa:"prawa",nazwa:"Sen",lacina:"Somnus",opis:"Jedyna przegrana. Przychodzi z monokultury albo z pustki: powieka schodzi z góry i z dołu płyty. Budzi cię wojna, którą sam rozpętałeś — i warta, która modli się pod twoim rdzeniem.",kiedy:"Gdy wstęga warstw zaczyna mieć jeden kolor — wysłuchaj proroka tej nacji albo skieruj na nią najazd czy powódź.",rycina:Ra(Nt)},{id:"prorok",grupa:"prawa",nazwa:"Prorok",lacina:"Propheta",opis:'Szept „prorokuj" albo karta „prorok” odrywa od nacji jednego z garstką wiernych. Nowa nacja od razu ma urazę do dawnej — a wojny z twojego szeptu cofają sen.',kiedy:"Najlepiej w największej nacji zwycięskiej krwi.",rycina:wd},{id:"droga",grupa:"prawa",nazwa:"Droga do wolności",lacina:"Via liberationis",opis:`Wygrywasz, gdy wierni przebiją skorupę rdzenia i uklękną przy nim. Po kolei: ktoś musi się modlić (wiara); jedna nacja musi uwierzyć na ${yi($.oddanieNacji)} — Cud przy jej gnieździe (oddanie) — albo sam poślesz trzech jej ludzi szeptem „módl się” lub kartą wydarzenia; przy przedsionku pod rdzeniem musi rosnąć grzyb, żeby warta przeżyła na dole (droga); warta modli się przy rdzeniu, aż skorupa pęknie (skorupa); potem wierni sami wchodzą do środka.`,kiedy:"Kroki widać na wstędze u dołu płyty. Po drodze nie daj górze zasnąć: nikt nie może wymrzeć ani zjeść reszty.",rycina:gd},{id:"skorupa",grupa:"prawa",nazwa:"Skorupa rdzenia",lacina:"Testa cordis",opis:`Kamień wokół rdzenia — nie da się go rozkuć. Pęka tylko pod modlitwą: gdy przy rdzeniu (do 16 kafli) stoi naraz co najmniej trzech wiernych (z dowolnych nacji), każdy z oddaniem od ${yi(J.minOddanie)}. Kuje nacja, której jest tam najwięcej — jej postęp zostaje przy niej. Każde pęknięcie wyjmuje jeden kafel od góry, od strony przedsionka; zwykle trzeba ich około pięciu, każde idzie wolniej od poprzedniego.`,kiedy:"Trzymaj trzech i więcej razem, najedzonych i wierzących. Postęp widać w procentach na wstędze i wieńcu rdzenia. Prorok dzieli wartę — nie teraz.",rycina:bd},{id:"rdzen",grupa:"prawa",nazwa:"Rdzeń",lacina:"Cor montis",opis:`Gdy przez skorupę prowadzi przejście, wierni sami schodzą do środka — nie musisz ich prowadzić. Kto dotknie rdzenia albo wejdzie do pustej komory wokół niego, kończy grę: wierzący (nacja ponad ${yi(J.uwolnienieNacja)} albo on sam ponad ${yi(J.uwolnienieWlasne)}) cię uwalnia, bezbożny zabija.`,kiedy:"Wierni muszą zdążyć pierwsi: karm wartę i nie wpuszczaj pod rdzeń obcych.",rycina:Ra(ir)},{id:"oddanie",grupa:"prawa",nazwa:"Oddanie i modlitwa",lacina:"Devotio",opis:`Każda nacja ma oddanie: od 0 do 100%, jak mocno w ciebie wierzy — widać je nad płytą, w złotej studni i na karcie mieszkańca. Ślepy Lud zaczyna od ${yi(Z.oddanieStart.slepyLud)}, inni prawie od zera. Kto wierzy, ten się modli: przy ołtarzu (stawiają go z rudy — daj im ją, gdy karta zapyta), przy twoim Cudzie i pod rdzeniem. Każda modlitwa daje ci Wiarę i trochę podnosi oddanie. Najszybciej podniesie je Cud przy gnieździe. Przy ${yi($.oddanieNacji)} nacja sama wyśle wartę pod rdzeń.`,kiedy:"Najprościej: Cud przy gnieździe Ślepego Ludu, Nakarm przy przedsionku — i szepnij „módl się” trzem z nich (albo wybierz „poślij pod rdzeń” na karcie).",rycina:hs},{id:"cechy",grupa:"prawa",nazwa:"Cechy nacji",lacina:"Mores gentium",opis:`Każda nacja rodzi się z jedną cechą — widać ją na podpisie przy gnieździe i na karcie mieszkańca. ${Ss.map(a=>`${a.nazwa.charAt(0).toUpperCase()}${a.nazwa.slice(1)}: ${a.opis}.`).join(" ")}`,kiedy:"Pod rdzeń najlepiej posyłać pobożnych. Wojowniczych trzymaj z dala od słabszych krwi — albo kieruj na najliczniejszych.",rycina:Ra(Nt)},{id:"pielgrzymka",grupa:"prawa",nazwa:"Pielgrzymka",lacina:"Peregrinatio",opis:`Gdy oddanie nacji przekroczy ${yi($.oddanieNacji)}, najwyżej pięciu najwierniejszych samo schodzi pod rdzeń i modli się pod skorupą — o ile przy przedsionku jest co jeść albo spod rdzenia da się wrócić do gniazda. Nie chcesz czekać? Szepnij „módl się” — wysłany idzie od razu, bez względu na wiarę swojej nacji.`,kiedy:"Nakarm przedsionek — drogę wierni przekopią sami, złota kreska pokazuje którędy.",rycina:hs},{id:"wydarzenia",grupa:"prawa",nazwa:"Wydarzenia",lacina:"Aestus",opis:"Mniej więcej co minutę coś się dzieje: najazd z powierzchni, powódź, zaraza, głód, prorok, kłótnia nacji, żyła rudy, prośba o znak. Gdy dwie nacje zaczynają wojnę, karta „pierwsza krew” przychodzi od razu. Czas wtedy staje, a karta pokazuje dwa albo trzy wybory — każdy z ceną i jednym zdaniem skutku.",kiedy:"Nie ma złych kart — są złe chwile. Gdy jedna krew bierze górę, kieruj na nią klęski; gdy ktoś wymiera albo ginie w wojnie, ratuj go; gdy nacja chce zejść pod rdzeń, poślij ją.",rycina:Ra(rr)},{id:"pauza",grupa:"prawa",nazwa:"Pauza",lacina:"Tempus suspensum",opis:"Czas możesz zatrzymać. Rozkazy wydane w pauzie rysują się jako szkice, rezerwują koszt i dzieją się naraz, gdy puścisz czas.",kiedy:"Zatrzymuj świat, gdy musisz trafić — i przy każdym kryzysie.",rycina:md},{id:"pismo",grupa:"prawa",nazwa:"Pismo w skale",lacina:"Scriptura ignota",opis:"W skale, do której nikt jeszcze nie zajrzał, widać znaki. Nikt z żyjących ich nie wyrył — były tu przed pierwszym goblinem. Gasną, gdy dojdzie do nich światło; w zatrzymanym czasie widać je wyraźniej.",kiedy:"Nie da się ich przeczytać. Można tylko pójść tam, gdzie są, i patrzeć, jak znikają.",rycina:jd}],Io=a=>Ia.find(e=>e.id===a),ds="trzewia:atlas";class Md{constructor(){this.znane=new Set,this.kolejka=[],this.niezobaczone=0;try{const e=localStorage.getItem(ds);if(e)for(const i of JSON.parse(e))this.znane.add(i)}catch{}}zna(e){return this.znane.has(e)}get ile(){return Ia.filter(e=>this.znane.has(e.id)).length}odkryj(e,i=!0){return this.znane.has(e)||!Ia.some(t=>t.id===e)?!1:(this.znane.add(e),i?this.kolejka.push(e):this.niezobaczone++,this.zapisz(),!0)}zapisz(){try{localStorage.setItem(ds,JSON.stringify([...this.znane]))}catch{}}}const Pe=new Md,Td=(a,e,i)=>e>=a.x&&e<=a.x+a.w&&i>=a.y&&i<=a.y+a.h,Sd=[[10,"X"],[9,"IX"],[5,"V"],[4,"IV"],[1,"I"]];function No(a){let e="";for(const[i,t]of Sd)for(;a>=i;)e+=t,a-=i;return e}function hr(a,e,i,t,o,n=1){a.save(),a.fillStyle="rgba(14,10,9,0.98)",a.fillRect(e,i,t,o),a.strokeStyle=M(j.atrament,.55*n),a.lineWidth=1,a.strokeRect(e+5.5,i+5.5,t-11,o-11),a.strokeStyle=M(j.atrament,.22*n),a.strokeRect(e+9.5,i+9.5,t-19,o-19);const s=Math.min(18,t*.06);a.strokeStyle=M(j.atramentMocny,.6*n),a.beginPath();for(const[r,l,h,d]of[[e,i,1,1],[e+t,i,-1,1],[e,i+o,1,-1],[e+t,i+o,-1,-1]])a.moveTo(r+h*2,l+d*(s+2)),a.lineTo(r+h*2,l+d*2),a.li linie:["Wiesz o sobie tylko tyle, ile wiedzą ci, którzy w tobie chodzą.","Tam, gdzie ktoś właśnie jest, rysunek ma pełną kreskę. Tam, gdzie ktoś był — blaknie i pokazuje stan sprzed pokoleń, nie dzisiejszy.","Tam, gdzie nie ma nikogo, nie ma nawet kreski — sama ciemność.","Drąż im drogi, a będą chodzić dalej. Im dalej chodzą, tym więcej o sobie widzisz."]},zasoby:{id:"zasoby",tytul:"Wiara, krew i oddanie",rysunek:Lt,linie:["Nie ma pasków ani liczb. Zasoby są rzeczami, które widzisz w ramie obrazu.","Wiara zbiera się pod sklepieniem jak dym ofiarny. Bierze się z modlitwy przy ołtarzach i kuźniach, a najwięcej z ofiary, którą składają sami.","Krew podnosi się w szczelinie u dołu. Płaci ci ją każda śmierć w twoich trzewiach — cudza wojna jest twoim dochodem.","Złota studnia w ramie to oddanie: jak mocno wierzy w ciebie najwierniejsza nacja. Gdy przekroczy kreskę, jej wierni sami zejdą pod twój rdzeń."]},rasy:{id:"rasy",tytul:"Sześć sposobów istnienia",rysunek:Bd,linie:["Nie ma tu ras lepszych i gorszych. Każda istnieje inaczej i inaczej rośnie.","Ślepy Lud rodzi dzieci i modli się najgorliwiej. Żużlowcy nie rodzą — wykuwają nowych kowali z rudy i żyją z ciepła kuźni.","Prządki nie podbijają, tylko biorą w jarzmo i przerabiają cudze dzieci na swoje. Trolem nikt się nie rodzi: trolem się zostaje, gdy kopie się za głęboko.","Grzybnia nie ma jednostek — rośnie ze zwłok i nie czci cię wcale. Ludzie nie mieszkają w tobie: schodzą z powierzchni po rudę i wracają."]},przyplyw:{id:"przyplyw",tytul:"Przypływ",rysunek:rr,linie:["Co kilka tysięcy tików coś wchodzi z zewnątrz i tasuje planszę.","Woda znajduje szczelinę i zalewa górne korytarze. Zaraza zabiera połowę sił każdemu. Żyła szaleństwa otwiera kryształ w głębi.","Z powierzchni schodzą ludzie po rudę i sławę — a gdy góra pustoszeje, nowe plemię przychodzi samo, bo pustka przyciąga.","Przypływu nie da się zatrzymać. Można tylko zdecydować, kto po nim zostanie."]},ksztaltuj:{id:"ksztaltuj",tytul:"Kształtuj",rysunek:Ld,linie:["Pierwszy czasownik rusza samą skałę i kosztuje Krew — a Krew bierze się z każdej śmierci w twoich trzewiach.","Drążysz korytarz, żeby ktoś dotarł do rudy albo do sąsiada, z którym ma na pieńku.","Zawalasz strop, żeby kogoś zasypać albo odciąć. Wpuszczasz wodę, żeby utopić tych, którzy nie pływają.","Otwierasz żar, bo Żużlowcy nie postawią kuźni tam, gdzie nie ma ognia. Magma wpuszczona do wody zastyga w kamień i zamyka przejście na zawsze."]},zasiej:{id:"zasiej",tytul:"Zasiej",rysunek:or,linie:["Nie rozkazujesz im, dokąd mają iść. Kładziesz w skale powód, żeby poszli.","Grzyb to jedzenie, które rośnie samo — i to on wyznacza, ilu Ślepego Ludu góra udźwignie.","Ruda karmi kuźnie: Żużlowcy nie rodzą dzieci, tylko wykuwają nowych kowali za trzy sztuki rudy.","Kości są jedzeniem od ręki i paliwem dla grzybni. Trucizna to kryształ: kto go kopie, wraca z głębi inny."]},szept:{id:"szept",tytul:"Szepcz",rysunek:nr,linie:["Najtańszy czasownik i jedyny, który dotyka kogoś po imieniu. Płacisz Wiarą.","Dotykasz jednego stworzenia — otwiera się jego karta: rasa, nacja i jedno zdanie o tym, kim jest.",'„Kop w dół" wysyła je głębiej, niż powinno; głębia daje kryształ i szaleństwo. Kto oszaleje do końca, wraca trolem.','„Prorokuj" robi z niego proroka: odchodzi z sześcioma wiernymi i zakłada własną nację, która od razu ma urazę do dawnej.',"To jest twoje główne narzędzie. Wojny nie zaczyna się armią, tylko jedną myślą w jednej głowie."]},znak:{id:"znak",tytul:"Znak",rysunek:sr,linie:["Jawny cud. Drogi — czterdzieści pięć Wiary — i widzą go wszyscy w promieniu dwudziestu sześciu kafli.",'„Objawienie" podnosi oddanie i gasi strach: modlą się gorliwiej, więc więcej Wiary wraca do ciebie.','„Panika" robi odwrotnie — rozbija oblężenie, wypędza za silną nację z cudzego terenu, ale oddanie spada.',"Po Znaku zostaje w skale świecący glif. Modlitwa przy nim liczy się podwójnie."]},skaz:{id:"skaz",tytul:"Skaź",rysunek:Ed,linie:["Ostatni czasownik zmienia krew całego gatunku i nie da się tego cofnąć.","Płacisz Krwią i Otchłanią: dotykasz jednego przedstawiciela, a zmiana idzie przez wszystkie pokolenia po nim.","Każda skaza ma cenę. Płodność skraca życie i podnosi głód. Żądza krwi daje siłę, ale oni przestają się modlić.","Ślepota spowalnia, za to każda modlitwa liczy się podwójnie. Kamienna skóra daje twardość kosztem kopania."]},spis:{id:"spis",tytul:"Spis ras i Sen",rysunek:Nt,linie:["Pod płytą leży wstęga warstw — tyle miejsca, ile zajmuje każda rasa.","Dopóki warstwy są różne, żyjesz. Gdy jedna zaczyna zjadać wstęgę, zwycięzcy przestają się bać i przestają cię potrzebować.","Wtedy Wiara i Krew wysychają, a z góry i z dołu zaczyna zsuwać się powieka. To twoja jedyna przegrana: zaśnięcie.","Dlatego cała gra polega na jednym: podtrzymuj konflikt, ale nie pozwól nikomu wyginąć."]},kronika:{id:"kronika",tytul:"Kronika",rysunek:Gd,linie:["Gra przez cały czas pisze. Jedna linijka na dole mówi, co się właśnie stało i jak oni to nazwali.","Są trzy końce: zaśnięcie, albo ktoś dojdzie do twojego rdzenia i uklęknie — to wolność — albo dojdzie i nie uklęknie.","W każdym z nich zostaje po tobie kronika — spisana legenda tego, czym byłeś dla tych, którzy w tobie mieszkali.","To jest twój wynik. Teraz zejdź i zobacz, co z tobą zrobią."]}},bo=`${Math.round($.oddanieNacji*100)}%`,Yd=[{tytul:"Rozejrzyj się",wstep:"Jesteś górą. W twoich korytarzach mieszkają małe ludy — to na nich patrzysz.",przygotuj:(a,e)=>{const i=e.gniazdoGoblinow();i&&a.pokazMiejsce(i.x,i.y,14,!0)},etapy:[{tekst:"Przeciągnij płytę palcem, żeby się rozejrzeć.",klawisz:"palcem",gest:"przeciagnij",gotowe:(a,e,i)=>(e==null?void 0:e.typ)==="kamera"&&Math.hypot(a.cam.x-i.kamStart.x,a.cam.y-i.kamStart.y)>3},{tekst:"Przybliż i oddal widok.",klawisz:"rozsuń albo zsuń dwa palce",gest:"kolko",gotowe:(a,e,i)=>(e==null?void 0:e.typ)==="kamera"&&e.rodzaj==="zoom"&&Math.abs(Math.log(a.cam.zoom/i.kamStart.zoom))>.25},{tekst:"Dotknij oka pod płytą — kamera wróci do mieszkańców.",klawisz:"kamera",wskaz:a=>a.przyc
