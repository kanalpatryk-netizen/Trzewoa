# TYMCZASOWE: sprząta szkic wydania z danymi mapy okolic Góry Hugona (plik do usunięcia zaraz potem).
name: Góra Hugona — sprzątanie danych mapy (tymczasowe)

on:
  push:
    branches: [ccr-133c3f14-lct7mo]
    paths: ['.github/workflows/hugon-dane.yml']

permissions:
  contents: write

jobs:
  sprzatanie:
    runs-on: ubuntu-latest
    steps:
      - name: Usuń szkic wydania
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release delete hugon-dane-tmp --yes || true
