# Gra do pobrania jednym kliknięciem.
#
# Po każdej zmianie w gałęzi main automat buduje obie wersje gry — każdą w jeden plik —
# i wystawia je jako wydanie „Trzewia — najnowsza wersja”:
#   trzewia.html          — na komputer (folder pc/)
#   trzewia-android.html  — na telefon z Androidem (folder android/)
# Linki …/releases/latest/download/<plik> zawsze pobierają najświeższą grę.
# Można też uruchomić ręcznie: Actions → „Gra do pobrania” → Run workflow.
name: Gra do pobrania

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gra-do-pobrania
  cancel-in-progress: true

jobs:
  wydanie:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            pc/package-lock.json
            android/package-lock.json

      - name: Komputer — budowa
        working-directory: pc
        run: |
          npm ci
          npx tsc --noEmit
          npm run pack

      - name: Android — budowa
        working-directory: android
        run: |
          npm ci
          npx tsc --noEmit
          npm run pack
          mv trzewia.html trzewia-android.html

      - name: Wydanie „najnowsza wersja”
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          kb() { echo $(( $(stat -c %s "$1") / 1024 )); }
          cat > notatki.md <<EOF
          **Jak zagrać:** pobierz plik (niżej, w sekcji *Assets*) i otwórz go w przeglądarce.

          - \`trzewia.html\` — na komputer ($(kb pc/trzewia.html) kB)
          - \`trzewia-android.html\` — na telefon z Androidem ($(kb android/trzewia-android.html) kB)

          Jeden plik, bez instalacji, działa też bez internetu.

          Zbudowane z commita ${GITHUB_SHA::7} ($(date -u +%Y-%m-%d)).
          EOF
          # jedno stałe wydanie, podmieniane przy każdej zmianie — linki /releases/latest/download/ się nie zmieniają
          # pliki podmieniamy w istniejącym wydaniu — gdy tworzenie nowego się nie udało, linki nie znikają
          if gh release view gra >/dev/null 2>&1; then
            gh release upload gra pc/trzewia.html android/trzewia-android.html --clobber
            gh release edit gra --notes-file notatki.md --latest
          else
            gh release create gra pc/trzewia.html android/trzewia-android.html \
              --target "$GITHUB_SHA" \
              --title "Trzewia — najnowsza wersja" \
              --notes-file notatki.md \
              --latest
          fi
