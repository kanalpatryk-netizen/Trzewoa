# Gra do pobrania jednym kliknięciem.
#
# Po każdej zmianie w gałęzi main automat buduje obie wersje gry — każdą w jeden plik —
# i wystawia je jako wydanie „Trzewia — najnowsza wersja”:
#   trzewia.html          — na komputer (folder pc/)
#   trzewia-android.html  — na telefon z Androidem (folder android/)
#   trzewia-v4-beta.html  — v4 beta na komputer (folder v4-beta/)
#   trzewia-v4.1-beta.html — v4.1 beta na komputer (folder v4.1-beta/)
#   trzewia-v4.2-beta.html — v4.2 beta na komputer (folder v4.2-beta/)
#   trzewia-remake-v1.html — Remake v1 na komputer (folder remake-v1/)
#   audio-test.html       — pracownia dźwięku, do odsłuchu nowego soundtracku (folder pracownia-dzwieku/)
# Linki …/releases/latest/download/<plik> zawsze pobierają najświeższą grę.
# Można też uruchomić ręcznie: Actions → „Gra do pobrania” → Run workflow.
name: Gra do pobrania

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gra-do-pobrania
  cancel-in-progress: true

jobs:
  wydanie:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            pc/package-lock.json
            android/package-lock.json
            v4-beta/package-lock.json
            v4.1-beta/package-lock.json
            v4.2-beta/package-lock.json
            remake-v1/package-lock.json

      - name: Komputer — budowa
        working-directory: pc
        run: |
          npm ci
          npx tsc --noEmit
          npm run pack

      - name: Android — budowa
        working-directory: android
        run: |
          npm ci
          npx tsc --noEmit
          npm run pack
          mv trzewia.html trzewia-android.html
          cp trzewia-android.html ../v3-remake/trzewia-v3-remake.html

      - name: v4 beta — budowa
        working-directory: v4-beta
        run: |
          npm ci
          npx tsc --noEmit
          npm run pack
          mv trzewia.html trzewia-v4-beta.html

      - name: v4.1 beta — budowa
        working-directory: v4.1-beta
        run: |
          npm ci
          npx tsc --noEmit
          npm run pack
          mv trzewia.html trzewia-v4.1-beta.html

      - name: v4.2 beta — budowa
        working-directory: v4.2-beta
        run: |
          npm ci
          npx tsc --noEmit
          npm run pack
          mv trzewia.html trzewia-v4.2-beta.html

      - name: Remake v1 — budowa
        working-directory: remake-v1
        run: |
          npm ci
          npx tsc --noEmit
          npm run pack
          mv trzewia.html trzewia-remake-v1.html

      - name: Audio test — kopia pod nazwą do pobrania
        run: cp pracownia-dzwieku/index.html audio-test.html

      - name: Wydanie „najnowsza wersja”
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          kb() { echo $(( $(stat -c %s "$1") / 1024 )); }
          cat > notatki.md <<EOF
          **Jak zagrać:** pobierz plik (niżej, w sekcji *Assets*) i otwórz go w przeglądarce.

          - \`trzewia.html\` — na komputer ($(kb pc/trzewia.html) kB)
          - \`trzewia-android.html\` — na telefon z Androidem ($(kb android/trzewia-android.html) kB)
          - \`trzewia-v3-remake.html\` — gra z telefonu (v3) na komputer, myszą
          - \`trzewia-remake-v1.html\` — Remake v1 na komputer (jeden lud: pobożni, robotnicy, rycerze; krew; wędrowna siedziba)
          - \`trzewia-v4.2-beta.html\` — v4.2 beta na komputer (drożejące wybory, mniej krwi, jaśniejszy świat)
          - \`trzewia-v4.1-beta.html\` — v4.1 beta na komputer (cechy nacji, łańcuchy kart, świat dnia, osiągnięcia)
          - \`trzewia-v4-beta.html\` — v4 beta na komputer (nowości, tryb deweloperski z dziennikiem)
          - \`audio-test.html\` — pracownia dźwięku: 45 dźwięków nowego soundtracku, każdy osobnym przyciskiem ($(kb audio-test.html) kB)

          Jeden plik, bez instalacji, działa też bez internetu.

          Zbudowane z commita ${GITHUB_SHA::7} ($(date -u +%Y-%m-%d)).
          EOF
          # jedno stałe wydanie, podmieniane przy każdej zmianie — linki /releases/latest/download/ się nie zmieniają
          # pliki podmieniamy w istniejącym wydaniu — gdy tworzenie nowego się nie udało, linki nie znikają
          if gh release view gra >/dev/null 2>&1; then
            gh release upload gra pc/trzewia.html android/trzewia-android.html v3-remake/trzewia-v3-remake.html v4-beta/trzewia-v4-beta.html v4.1-beta/trzewia-v4.1-beta.html v4.2-beta/trzewia-v4.2-beta.html remake-v1/trzewia-remake-v1.html audio-test.html --clobber
            gh release edit gra --notes-file notatki.md --latest
          else
            gh release create gra pc/trzewia.html android/trzewia-android.html v3-remake/trzewia-v3-remake.html v4-beta/trzewia-v4-beta.html v4.1-beta/trzewia-v4.1-beta.html v4.2-beta/trzewia-v4.2-beta.html remake-v1/trzewia-remake-v1.html audio-test.html \
              --target "$GITHUB_SHA" \
              --title "Trzewia — najnowsza wersja" \
              --notes-file notatki.md \
              --latest
          fi
