# Gra do pobrania jednym kliknięciem.
#
# Po każdej zmianie w gałęzi main automat buduje obie wersje gry — każdą w jeden plik —
# i wystawia je jako wydanie „Trzewia — najnowsza wersja”:
#   trzewia.html          — na komputer (folder pc/)
#   trzewia-android.html  — na telefon z Androidem (folder android/)
#   trzewia-v4-beta.html  — v4 beta na komputer (folder v4-beta/)
#   trzewia-v4.1-beta.html — v4.1 beta na komputer (folder v4.1-beta/)
#   trzewia-v4.2-beta.html — v4.2 beta na komputer (folder v4.2-beta/)
#   trzewia-remake-v1.html — Remake v1 na komputer (folder remake-v1/)
#   trzewia-remake-v2.html — Remake v2 na komputer (folder remake-v2/)
#   trzewia-remake-v2-obserwatorium.html — Remake v2: cztery okna gry, w każdym gra bot
#   trzewia-alpha-0.1.html — Alpha 0.1 na komputer (folder alpha-0.1/)
#   trzewia-alpha-0.1-obserwatorium.html — Alpha 0.1: cztery okna gry, w każdym gra bot
#   trzewia-alpha-0.2.html — Alpha 0.2 na komputer (folder alpha-0.2/)
#   trzewia-alpha-0.2-obserwatorium.html — Alpha 0.2: cztery okna gry, w każdym gra bot
#   trzewia-alpha-0.3.html — Alpha 0.3 (folder alpha-0.3/): wersja połączona; -patryk, -pawel — dwie wizje osobno; i ich obserwatoria
#   audio-test.html       — pracownia dźwięku, do odsłuchu nowego soundtracku (folder pracownia-dzwieku/)
# Linki …/releases/latest/download/<plik> zawsze pobierają najświeższą grę.
# Można też uruchomić ręcznie: Actions → „Gra do pobrania” → Run workflow.
name: Gra do pobrania

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gra-do-pobrania
  cancel-in-progress: true

jobs:
  wydanie:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            pc/package-lock.json
            android/package-lock.json
            v4-beta/package-lock.json
            v4.1-beta/package-lock.json
            v4.2-beta/package-lock.json
            remake-v1/package-lock.json
            remake-v2/package-lock.json
            alpha-0.1/package-lock.json
            alpha-0.2/package-lock.json

      - name: Komputer — budowa
        working-directory: pc
        run: |
          npm ci
          npx tsc --noEmit
          npm run pack

      - name: Android — budowa
        working-directory: android
        run: |
          npm ci
          npx tsc --noEmit
          npm run pack
          mv trzewia.html trzewia-android.html
          cp trzewia-android.html ../v3-remake/trzewia-v3-remake.html

      - name: v4 beta — budowa
        working-directory: v4-beta
        run: |
          npm ci
          npx tsc --noEmit
          npm run pack
          mv trzewia.html trzewia-v4-beta.html

      - name: v4.1 beta — budowa
        working-directory: v4.1-beta
        run: |
          npm ci
          npx tsc --noEmit
          npm run pack
          mv trzewia.html trzewia-v4.1-beta.html

      - name: v4.2 beta — budowa
        working-directory: v4.2-beta
        run: |
          npm ci
          npx tsc --noEmit
          npm run pack
          mv trzewia.html trzewia-v4.2-beta.html

      - name: Remake v1 — budowa
        working-directory: remake-v1
        run: |
          npm ci
          npx tsc --noEmit
          npm run pack
          mv trzewia.html trzewia-remake-v1.html

      - name: Remake v2 — budowa (gra i obserwatorium)
        working-directory: remake-v2
        run: |
          npm ci
          npx tsc --noEmit
          npm run pack
          node scripts/obserwatorium.mjs
          mv trzewia.html trzewia-remake-v2.html
          mv obserwatorium.html trzewia-remake-v2-obserwatorium.html

      - name: Alpha 0.1 — budowa (gra i obserwatorium)
        working-directory: alpha-0.1
        run: |
          npm ci
          npx tsc --noEmit
          npm run pack
          node scripts/obserwatorium.mjs
          mv trzewia.html trzewia-alpha-0.1.html
          mv obserwatorium.html trzewia-alpha-0.1-obserwatorium.html

      - name: Alpha 0.2 — budowa (gra i obserwatorium)
        working-directory: alpha-0.2
        run: |
          npm ci
          npx tsc --noEmit
          npm run pack
          node scripts/obserwatorium.mjs
          mv trzewia.html trzewia-alpha-0.2.html
          mv obserwatorium.html trzewia-alpha-0.2-obserwatorium.html

      - name: Alpha 0.3 — budowa (wersja połączona oraz wizje Patryka i Pawła, z obserwatoriami)
        working-directory: alpha-0.3
        run: |
          npm ci
          npx tsc --noEmit
          npm run obserwatorium
          mv trzewia-razem.html trzewia-alpha-0.3.html
          mv obserwatorium-razem.html trzewia-alpha-0.3-obserwatorium.html
          mv trzewia-patryk.html trzewia-alpha-0.3-patryk.html
          mv trzewia-pawel.html trzewia-alpha-0.3-pawel.html
          mv obserwatorium-patryk.html trzewia-alpha-0.3-patryk-obserwatorium.html
          mv obserwatorium-pawel.html trzewia-alpha-0.3-pawel-obserwatorium.html

      - name: Audio test — kopia pod nazwą do pobrania
        run: cp pracownia-dzwieku/index.html audio-test.html

      - name: Wydanie „najnowsza wersja”
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          kb() { echo $(( $(stat -c %s "$1") / 1024 )); }
          cat > notatki.md <<EOF
          **Jak zagrać:** pobierz plik (niżej, w sekcji *Assets*) i otwórz go w przeglądarce.

          - \`trzewia.html\` — na komputer ($(kb pc/trzewia.html) kB)
          - \`trzewia-android.html\` — na telefon z Androidem ($(kb android/trzewia-android.html) kB)
          - \`trzewia-v3-remake.html\` — gra z telefonu (v3) na komputer, myszą
          - \`trzewia-alpha-0.3.html\` — Alpha 0.3 na komputer: najnowsza gra — obie wizje razem: ślub i talia tarota (Paweł) oraz drużyna z imionami i perkami jako kafelki po lewej (Patryk); \`trzewia-alpha-0.3-obserwatorium.html\` — jej obserwatorium
          - \`trzewia-alpha-0.3-patryk.html\` — Alpha 0.3, wizja Patryka: imienna drużyna — 6 kart postaci z perkami zamiast dolnego panelu
          - \`trzewia-alpha-0.3-pawel.html\` — Alpha 0.3, wizja Pawła: ślub drużyny na starcie i talia tarota (buffy i nerfy za wiarę)
          - \`trzewia-alpha-0.3-patryk-obserwatorium.html\`, \`trzewia-alpha-0.3-pawel-obserwatorium.html\` — Alpha 0.3: obserwatoria obu wersji
          - \`trzewia-alpha-0.2.html\` — Alpha 0.2 na komputer: w budowie — dalszy ciąg Alphy 0.1: Wielki Pomnik demona kruszony modlitwą, demon z jego gruzów, wygrana po pokonaniu demona
          - \`trzewia-alpha-0.2-obserwatorium.html\` — Alpha 0.2: obserwatorium — cztery okna gry naraz, w każdym gra bot
          - \`trzewia-alpha-0.1.html\` — Alpha 0.1 na komputer (etapy 1–4) (stała drużyna i rozkazy, bez lin, góra według szkicu, liczniki żelaza i złota, pomieszczenia: warsztat, kuźnia, sypialnia, ołtarz z rytuałami za krew, drabiny)
          - \`trzewia-alpha-0.1-obserwatorium.html\` — Alpha 0.1: obserwatorium — cztery okna gry naraz, w każdym gra bot
          - \`trzewia-remake-v2.html\` — Remake v2 na komputer (z dłonią z otchłani w Koszmarze)
          - \`trzewia-remake-v2-obserwatorium.html\` — Remake v2: obserwatorium — cztery okna gry naraz, w każdym gra bot; tempo, styl bota i ziarno osobno dla każdego okna, kliknięcie powiększa okno
          - \`trzewia-remake-v1.html\` — Remake v1 na komputer (jeden lud: pobożni, robotnicy, rycerze; krew; wędrowna siedziba; oprawa jak freski w krypcie; rozległe jaskinie; mrok, a w nim Ten, który patrzy)
          - \`trzewia-v4.2-beta.html\` — v4.2 beta na komputer (drożejące wybory, mniej krwi, jaśniejszy świat)
          - \`trzewia-v4.1-beta.html\` — v4.1 beta na komputer (cechy nacji, łańcuchy kart, świat dnia, osiągnięcia)
          - \`trzewia-v4-beta.html\` — v4 beta na komputer (nowości, tryb deweloperski z dziennikiem)
          - \`audio-test.html\` — pracownia dźwięku: 45 dźwięków nowego soundtracku, każdy osobnym przyciskiem ($(kb audio-test.html) kB)

          Jeden plik, bez instalacji, działa też bez internetu.

          Zbudowane z commita ${GITHUB_SHA::7} ($(date -u +%Y-%m-%d)).
          EOF
          # jedno stałe wydanie, podmieniane przy każdej zmianie — linki /releases/latest/download/ się nie zmieniają
          # pliki podmieniamy w istniejącym wydaniu — gdy tworzenie nowego się nie udało, linki nie znikają
          if gh release view gra >/dev/null 2>&1; then
            gh release upload gra pc/trzewia.html android/trzewia-android.html v3-remake/trzewia-v3-remake.html v4-beta/trzewia-v4-beta.html v4.1-beta/trzewia-v4.1-beta.html v4.2-beta/trzewia-v4.2-beta.html remake-v1/trzewia-remake-v1.html remake-v2/trzewia-remake-v2.html remake-v2/trzewia-remake-v2-obserwatorium.html alpha-0.1/trzewia-alpha-0.1.html alpha-0.1/trzewia-alpha-0.1-obserwatorium.html alpha-0.2/trzewia-alpha-0.2.html alpha-0.2/trzewia-alpha-0.2-obserwatorium.html alpha-0.3/trzewia-alpha-0.3.html alpha-0.3/trzewia-alpha-0.3-obserwatorium.html alpha-0.3/trzewia-alpha-0.3-patryk.html alpha-0.3/trzewia-alpha-0.3-pawel.html alpha-0.3/trzewia-alpha-0.3-patryk-obserwatorium.html alpha-0.3/trzewia-alpha-0.3-pawel-obserwatorium.html audio-test.html --clobber
            gh release edit gra --notes-file notatki.md --latest
          else
            gh release create gra pc/trzewia.html android/trzewia-android.html v3-remake/trzewia-v3-remake.html v4-beta/trzewia-v4-beta.html v4.1-beta/trzewia-v4.1-beta.html v4.2-beta/trzewia-v4.2-beta.html remake-v1/trzewia-remake-v1.html remake-v2/trzewia-remake-v2.html remake-v2/trzewia-remake-v2-obserwatorium.html alpha-0.1/trzewia-alpha-0.1.html alpha-0.1/trzewia-alpha-0.1-obserwatorium.html alpha-0.2/trzewia-alpha-0.2.html alpha-0.2/trzewia-alpha-0.2-obserwatorium.html alpha-0.3/trzewia-alpha-0.3.html alpha-0.3/trzewia-alpha-0.3-obserwatorium.html alpha-0.3/trzewia-alpha-0.3-patryk.html alpha-0.3/trzewia-alpha-0.3-pawel.html alpha-0.3/trzewia-alpha-0.3-patryk-obserwatorium.html alpha-0.3/trzewia-alpha-0.3-pawel-obserwatorium.html audio-test.html \
              --target "$GITHUB_SHA" \
              --title "Trzewia — najnowsza wersja" \
              --notes-file notatki.md \
              --latest
          fi
