# Gra do pobrania jednym kliknięciem.
#
# Po każdej zmianie w gałęzi main automat buduje grę w jeden plik (trzewia.html)
# i wystawia go jako wydanie „Trzewia — najnowsza wersja”. Link
#   https://github.com/<właściciel>/<repozytorium>/releases/latest/download/trzewia.html
# zawsze pobiera najświeższą grę. Można też uruchomić ręcznie: Actions → „Gra do pobrania” → Run workflow.
name: Gra do pobrania

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gra-do-pobrania
  cancel-in-progress: true

jobs:
  wydanie:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalacja
        run: npm ci

      - name: Sprawdzenie typów
        run: npx tsc --noEmit

      - name: Budowa jednego pliku
        run: npm run pack

      - name: Wydanie „najnowsza wersja”
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rozmiar=$(( $(stat -c %s trzewia.html) / 1024 ))
          cat > notatki.md <<EOF
          **Jak zagrać:** pobierz \`trzewia.html\` (niżej, w sekcji *Assets*) i otwórz go w przeglądarce — dwuklik wystarczy.
          Jeden plik, ${rozmiar} kB. Bez instalacji, działa też bez internetu.

          Zbudowane z commita ${GITHUB_SHA::7} ($(date -u +%Y-%m-%d)).
          EOF
          # jedno stałe wydanie, podmieniane przy każdej zmianie — link /releases/latest/download/ się nie zmienia
          gh release delete gra --cleanup-tag --yes || true
          gh release create gra trzewia.html \
            --target "$GITHUB_SHA" \
            --title "Trzewia — najnowsza wersja" \
            --notes-file notatki.md \
            --latest
