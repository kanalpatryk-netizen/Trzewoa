ko.","Grzybnia nie ma jednostek — rośnie ze zwłok i nie czci cię wcale. Ludzie nie mieszkają w tobie: schodzą z powierzchni po rudę i wracają."]},przyplyw:{id:"przyplyw",tytul:"Przypływ",rysunek:Tn,linie:["Co kilka tysięcy tików coś wchodzi z zewnątrz i tasuje planszę.","Woda znajduje szczelinę i zalewa górne korytarze. Zaraza zabiera połowę sił każdemu. Żyła szaleństwa otwiera kryształ w głębi.","Z powierzchni schodzą ludzie po rudę i sławę — a gdy góra pustoszeje, nowe plemię przychodzi samo, bo pustka przyciąga.","Przypływu nie da się zatrzymać. Można tylko zdecydować, kto po nim zostanie."]},ksztaltuj:{id:"ksztaltuj",tytul:"Kształtuj",rysunek:kn,linie:["Pierwszy czasownik rusza samą skałę i kosztuje Krew — a Krew bierze się z każdej śmierci w twoich trzewiach.","Drążysz korytarz, żeby ktoś dotarł do rudy albo do sąsiada, z którym ma na pieńku.","Zawalasz strop, żeby kogoś zasypać albo odciąć. Wpuszczasz wodę, żeby utopić tych, którzy nie pływają.","Otwierasz żar, bo Żużlowcy nie postawią kuźni tam, gdzie nie ma ognia. Magma wpuszczona do wody zastyga w kamień i zamyka przejście na zawsze."]},zasiej:{id:"zasiej",tytul:"Zasiej",rysunek:zn,linie:["Nie rozkazujesz im, dokąd mają iść. Kładziesz w skale powód, żeby poszli.","Grzyb to jedzenie, które rośnie samo — i to on wyznacza, ilu Ślepego Ludu góra udźwignie.","Ruda karmi kuźnie: Żużlowcy nie rodzą dzieci, tylko wykuwają nowych kowali za cztery sztuki rudy.","Kości są jedzeniem od ręki i paliwem dla grzybni. Trucizna to kryształ: kto go kopie, wraca z głębi inny."]},szept:{id:"szept",tytul:"Szepcz",rysunek:mn,linie:["Najtańszy czasownik i jedyny, który dotyka kogoś po imieniu. Płacisz Wiarą.","Dotykasz jednego stworzenia — otwiera się jego karta: rasa, nacja i jedno zdanie o tym, kim jest.",'„Kop w dół" wysyła je głębiej, niż powinno; głębia daje kryształ i szaleństwo. Kto oszaleje do końca, wraca trolem.','„Prorokuj" robi z niego proroka: odchodzi z sześcioma wiernymi i zakłada własną nację, która od razu ma urazę do dawnej.',"To jest twoje główne narzędzie. Wojny nie zaczyna się armią, tylko jedną myślą w jednej głowie."]},znak:{id:"znak",tytul:"Znak",rysunek:pn,linie:["Jawny cud. Drogi — czterdzieści pięć Wiary — i widzą go wszyscy w promieniu dwudziestu sześciu kafli.",'„Objawienie" podnosi oddanie i gasi strach: modlą się gorliwiej, więc więcej Wiary wraca do ciebie.','„Panika" robi odwrotnie — rozbija oblężenie, wypędza za silną nację z cudzego terenu, ale oddanie spada.',"Po Znaku zostaje w skale świecący glif. Modlitwa przy nim liczy się podwójnie."]},skaz:{id:"skaz",tytul:"Skaź",rysunek:wn,linie:["Ostatni czasownik zmienia krew całego gatunku i nie da się tego cofnąć.","Płacisz Krwią i Otchłanią: dotykasz jednego przedstawiciela, a zmiana idzie przez wszystkie pokolenia po nim.","Każda skaza ma cenę. Płodność skraca życie i podnosi głód. Żądza krwi daje siłę, ale oni przestają się modlić.","Ślepota spowalnia, za to każda modlitwa liczy się podwójnie. Kamienna skóra daje twardość kosztem kopania."]},spis:{id:"spis",tytul:"Spis ras i Sen",rysunek:gn,linie:["Pod płytą leży wstęga warstw — tyle miejsca, ile zajmuje każda rasa.","Dopóki warstwy są różne, żyjesz. Gdy jedna zaczyna zjadać wstęgę, zwycięzcy przestają się bać i przestają cię potrzebować.","Wtedy Wiara i Krew wysychają, a z góry i z dołu zaczyna zsuwać się powieka. To twoja jedyna przegrana: zaśnięcie.","Dlatego cała gra polega na jednym: podtrzymuj konflikt, ale nie pozwól nikomu wyginąć."]},kronika:{id:"kronika",tytul:"Kronika",rysunek:bn,linie:["Gra przez cały czas pisze. Jedna linijka na dole mówi, co się właśnie stało i jak oni to nazwali.","Wygranej nie ma. Są trzy końce: zaśnięcie, albo ktoś dokopie się do twojego rdzenia i uklęknie, albo dokopie się i nie uklęknie.","W każdym z nich zostaje po tobie kronika — spisana legenda tego, czym byłeś dla tych, którzy w tobie mieszkali.","To jest twój wynik. Teraz zejdź i zobacz, co z tobą zrobią."]}};class An{constructor(t){this.app=t,this.nazwa="samouczek",th
