nst at=[{id:"rasa-0",grupa:"rasy",nazwa:"Pobożni",lacina:"Gens pia",opis:`Twój jedyny lud. Nikt się nie rodzi — co ${Math.round(G.wyjscieCo/120)} sekund skała wydaje nowego za krew: pobożnego, który się modli, albo robotnika, który kopie drogę i donosi jedzenie. Rycerzy skała nie wydaje — śpią w gniazdach w skale.`,kiedy:"Pilnuj krwi i spiżarni. Pobożny może się okaleczyć (krew, ale słabnie na zawsze), a każdego możesz złożyć w ofierze. Bez pobożnych i bez krwi na nowego — przegrywasz.",rycina:dt(I.GOBLIN,"modli")},{id:"rasa-1",grupa:"rasy",nazwa:"Żużlowcy",lacina:"Fabri scoriae",opis:"Nie rodzą się — wykuwa się ich w kuźni z trzech bryłek rudy. Żyją z ciepła ognia i giną, gdy kuźnia wygaśnie. Obłęd głębi ima się ich słabiej niż innych.",kiedy:"Gdy odsłoni się ruda, daj ją Żużlowcom — wykują z niej nowych kowali. Grzyba nie jedzą: żyją z ciepła kuźni.",rycina:dt(I.DWARF,"kopie")},{id:"rasa-2",grupa:"rasy",nazwa:"Trole",lacina:"Qui nimis fodit",opis:"Trolem nikt się nie rodzi — zostaje nim ten, kto kopał za głęboko i wrócił inny. Silny, powolny, nie czci nikogo. Głodny poluje, a gdy nie ma na kogo, zasypia w skale.",kiedy:"Rodzą się z szaleńców — przy karcie żyły szaleństwa „zostaw” daje nowych trolów, „zasklep” ich nie da.",rycina:dt(I.TROLL,"stoi",.95)},{id:"rasa-3",grupa:"rasy",nazwa:"Prządki",lacina:"Textrices servorum",opis:"Nie podbijają — przejmują. Biorą słabszych w jarzmo, przerabiają cudze dzieci na swoje, a głodne wysysają tych, których wzięły. Rosną wyłącznie cudzym kosztem.",kiedy:"Potrzebują sąsiadów słabszych od siebie. Nakarm je, gdy głodują; gdy zaczną wojnę, karta „pierwsza krew” pozwoli ich rozdzielić.",rycina:dt(I.SPINNER,"stoi",.8)},{id:"rasa-4",grupa:"rasy",nazwa:"Ludzie",lacina:"Advenae superni",opis:"Nie mieszkają w tobie. Schodzą z powierzchni po rudę i sławę, zabierają, co znajdą, i wracają na górę. Nie liczą się do wstęgi warstw.",kiedy:"Gdy przyjdzie karta najazdu: zawal wejście, wpuść ich albo poprowadź na najliczniejszych. Każda ich śmierć to twoja krew.",rycina:dt(I.HUMAN,"idzie")},{id:"rasa-5",grupa:"rasy",nazwa:"Grzybnia",lacina:"Caro in fungum",opis:"Nie ma jednostek i nie czci cię wcale. Rośnie ze zwłok — każda śmierć to paliwo na kilka kafli. Obcym parzy stopy, Ślepemu Ludowi daje jeść.",kiedy:"Wyrasta sama po każdej rzezi. Gdzie jej za dużo, zmyje ją powódź z karty wydarzenia.",rycina:wc},{id:"ryt-zasiej",grupa:"ryty",nazwa:"Nakarm",lacina:"Semen causae",opis:"Nie rozkazujesz, dokąd iść — kładziesz w skale powód. Grzyb to jedzenie, ruda to materiał na ołtarze i kuźnie, kości są padliną, która też karmi.",kiedy:"Siej przy tych, których jest najmniej. Dosypywanie zwycięzcy przybliża sen.",koszt:`grzyb ${Ai("zasiej","grzyb")}, ruda ${Ai("zasiej","ruda")}`,rycina:Va($l)},{id:"ryt-szept",grupa:"ryty",nazwa:"Szepnij",lacina:"Susurrus",opis:"Dotykasz jednej głowy. „Módl się” posyła go pod twój rdzeń: idzie tam jako wierny i modli się pod skorupą. „Prorokuj” odrywa go z garstką wiernych w nową nację.",kiedy:"Trzech wysłanych „módl się” wystarczy, żeby skorupa zaczęła pękać. Prorok rozbija nację, która zjada resztę.",koszt:`módl się ${Ai("szept","modl")}, prorok ${Ai("szept","prorok")}`,rycina:Va(Xl)},{id:"ryt-znak",grupa:"ryty",nazwa:"Cud",lacina:"Signum manifestum",opis:"Jawny cud widziany w promieniu dwudziestu sześciu kafli. Podnosi oddanie nacji i gasi strach. Zostaje świecący glif — modlitwa przy nim liczy się podwójnie.",kiedy:"Stawiaj przy gnieździe nacji, którą chcesz doprowadzić do rdzenia. Jedno, dwa objawienia i sama wyśle wartę.",koszt:Ai("znak","objawienie"),rycina:Va(Ul)},{id:"krew",grupa:"zasoby",nazwa:"Krew",lacina:"Sanguis",opis:"Liczba nad płytą i czerwona rysa pod nią. Płaci ci ją każda śmierć — także Strażników Snu i buntowników — szept „ofiaruj” i samookaleczenie pobożnego.",kiedy:"Wydajesz ją na nowych ze skały, na jedzenie (ryt Nakarm) i na wybory na kartach wydarzeń.",rycina:Va(Co)},{id:"wiara",grupa:"zasoby",nazwa:"Wiara",lacina:"Fides",opis:"Liczba nad płytą — twój zapas. Rośnie za każdym razem, gdy ktoś się do ciebie modli: przy ołtarzu, kuźni, twoim Cudzie, a najmocniej pod rdzeniem. Mieści się jej najwyżej 200. Nie myl jej z oddaniem: Wiara to twoja waluta, oddanie to to, jak mocno wierzy nacja.",kiedy:"Płacisz nią za szept, Cud i wybory na kartach wydarzeń. Więcej w tablicy Oddanie i modlitwa.",rycina:Va(Co)},{id:"pamiec",grupa:"prawa",nazwa:"Pamięć",lacina:"Memoria",opis:"Widzisz siebie tylko tam, gdzie ktoś jest albo był. Gdzie nikt nie chodzi, rysunek blaknie i pokazuje stan sprzed pokoleń, a potem ciemność.",kiedy:"Im dalej chodzą twoi mieszkańcy, tym więcej o sobie widzisz.",rycina:Va(Zl)},{id:"sen",grupa:"prawa",nazwa:"Przegrana",lacina:"Casus",opis:"Przegrywasz, gdy nie da się już wygrać: nie żyje żaden pobożny, a nawet ofiara ze wszystkich nie da krwi na nowego. Najczęstsza droga do tego to głód — lud daleko od spiżarni, bez robotników, którzy noszą jedzenie.",kiedy:"Trzymaj robotników, zakładaj obozy ze spiżarniami i sadź przy nich grzyb. Nie wysyłaj pod rdzeń ostatniego pobożnego.",rycina:Va(Wo)},{id:"prorok",grupa:"prawa",nazwa:"Prorok",lacina:"Propheta",opis:'Szept „prorokuj" albo karta „prorok” odrywa od nacji jednego z garstką wiernych. Nowa nacja od razu ma urazę do dawnej — a wojny z twojego szeptu cofają sen.',kiedy:"Najlepiej w największej nacji zwycięskiej krwi.",rycina:gc},{id:"droga",grupa:"prawa",nazwa:"Droga do wolności",lacina:"Via liberationis",opis:`Wygrywasz, gdy pobożni przebiją skorupę rdzenia i uklękną przy nim. Po kolei: pobożni się modlą (wiara); lud uwierzy na ${Dt(U.oddanieNacji)} albo sam poślesz trzech szeptem „módl się” (oddanie); robotnicy wykopią drogę do rdzenia — złotą kreskę (droga); pobożni modlą się pod rdzeniem, rycerze trzymają wartę, a fale Strażników Snu trzeba pokonać (skorupa); potem wierni sami wchodzą do środka.`,kiedy:"Kroki widać na wstędze drogi. Rycerzy szukaj wcześnie — bez nich nie pokonasz ostatniej fali.",rycina:mc},{id:"skorupa",grupa:"prawa",nazwa:"Skorupa rdzenia",lacina:"Testa cordis",opis:`Kamień wokół rdzenia — nie da się go rozkuć. Pęka tylko pod modlitwą: gdy przy rdzeniu (do 16 kafli) stoi naraz co najmniej trzech wiernych (z dowolnych nacji), każdy z oddaniem od ${Dt(J.minOddanie)}. Kuje nacja, której jest tam najwięcej — jej postęp zostaje przy niej. Każde pęknięcie wyjmuje jeden kafel od góry, od strony przedsionka; zwykle trzeba ich około pięciu, każde idzie wolniej od poprzedniego.`,kiedy:"Trzymaj trzech i więcej razem, najedzonych i wierzących. Przy 20, 45, 70 i 90% wychodzą Strażnicy Snu — dopóki żyją, skorupa nie pęka.",rycina:jn},{id:"rdzen",grupa:"prawa",nazwa:"Rdzeń",lacina:"Cor montis",opis:`Gdy przez skorupę prowadzi przejście, wierni sami schodzą do środka — nie musisz ich prowadzić. Kto dotknie rdzenia albo wejdzie do pustej komory wokół niego, kończy grę: wierzący (nacja ponad ${Dt(J.uwolnienieNacja)} albo on sam ponad ${Dt(J.uwolnienieWlasne)}) cię uwalnia, bezbożny zabija.`,kiedy:"Wierni muszą zdążyć pierwsi: karm wartę i nie wpuszczaj pod rdzeń obcych.",rycina:Va(Kl)},{id:"oddanie",grupa:"prawa",nazwa:"Oddanie i modlitwa",lacina:"Devotio",opis:`Każda nacja ma oddanie: od 0 do 100%, jak mocno w ciebie wierzy — widać je nad płytą, w złotej studni i na karcie mieszkańca. Ślepy Lud zaczyna od ${Dt(q.oddanieStart.slepyLud)}, inni prawie od zera. Kto wierzy, ten się modli: przy ołtarzu (stawiają go z rudy — daj im ją, gdy karta zapyta), przy twoim Cudzie i pod rdzeniem. Każda modlitwa daje ci Wiarę i trochę podnosi oddanie. Najszybciej podniesie je Cud przy gnieździe. Przy ${Dt(U.oddanieNacji)} nacja sama wyśle wartę pod rdzeń.`,kiedy:"Najprościej: Cud przy gnieździe Ślepego Ludu, Nakarm przy przedsionku — i szepnij „módl się” trzem z nich (albo wybierz „poślij pod rdzeń” na karcie).",rycina:Os},{id:"cechy",grupa:"prawa",nazwa:"Cechy nacji",lacina:"Mores gentium",opis:`Każda nacja rodzi się z jedną cechą — widać ją na podpisie przy gnieździe i na karcie mieszkańca. ${Fs.map(a=>`${a.nazwa.charAt(0).toUpperCase()}${a.nazwa.slice(1)}: ${a.opis}.`).join(" ")}`,kiedy:"Pod rdzeń najlepiej posyłać pobożnych. Wojowniczych trzymaj z dala od słabszych krwi — albo kieruj na najliczniejszych.",rycina:Va(Wo)},{id:"pielgrzymka",grupa:"prawa",nazwa:"Pielgrzymka",lacina:"Peregrinatio",opis:`Gdy oddanie nacji przekroczy ${Dt(U.oddanieNacji)}, najwyżej pięciu najwierniejszych samo schodzi pod rdzeń i modli się pod skorupą — o ile przy przedsionku jest co jeść albo spod rdzenia da się wrócić do gniazda. Nie chcesz czekać? Szepnij „módl się” — wysłany idzie od razu, bez względu na wiarę swojej nacji.`,kiedy:"Nakarm przedsionek — drogę wierni przekopią sami, złota kreska pokazuje którędy.",rycina:Os},{id:"wydarzenia",grupa:"prawa",nazwa:"Wydarzenia",lacina:"Aestus",opis:"Mniej więcej co minutę coś się dzieje: najazd z powierzchni, powódź, zaraza, głód, spisek rycerzy, zatrute plony, woda nad obozem, zawał nad drogą wiernych, sen o kamiennych rycerzach. Czas wtedy staje, a karta pokazuje dwa albo trzy wybory — każdy z ceną i jednym zdaniem skutku. Niektóre wracają: zostawiony spisek po dwóch minutach wybucha buntem — część rycerzy zmienia barwy i bije lud.",kiedy:"Spisek gaś od razu, jeśli stać cię na krew. Zatrute plony lepiej spalić niż zjeść. Sen o rycerzach pokazuje gniazdo — warto.",rycina:Va(Fl)},{id:"role",grupa:"prawa",nazwa:"Role ludu",lacina:"Officia",opis:"Pobożni modlą się i kruszą skorupę; stoją przy obozie najbliżej rdzenia. Robotnicy kopią drogę do rdzenia, zbierają grzyb do spiżarni, donoszą jedzenie stojącym i zaopatrują obóz frontowy. Rycerze mają miecz i cztery razy więcej życia; poza wartą pilnują obozu z jedzeniem, a w czasie fali walczą ze Strażnikami.",kiedy:"Na karcie postaci widać jej zamiar i ile jeszcze go trzyma. Kogo wyda skała, wybierasz pod paskiem ról.",rycina:dt(I.GOBLIN,"kopie")},{id:"gniazda",grupa:"prawa",nazwa:"Kamienni rycerze",lacina:"Equites saxei",opis:`W każdej górze śpi ${G.gniazda} gniazd po ${G.gniazdoRycerzy.od}–${G.gniazdoRycerzy.do} rycerzy — z dala od magmy, wody i drogi do rdzenia. Gdy ktoś z ludu jest blisko, skała słabo się żarzy. Kto się dokopie, budzi ich: wychodzą od razu jako weterani.`,kiedy:"Szepnij robotnikowi „przemyśl i kop”: klęka, prosi o znak i kopie tunel ku najbliższemu gniazdu. Znak jest niedokładny — jeden kopacz trafia raz na trzy, trzech razem na pewno.",rycina:dt(I.GOBLIN,"kopie")},{id:"weterani",grupa:"prawa",nazwa:"Weterani i aureole",lacina:"Veterani",opis:`Kto przeżyje w ludzie ${Math.round(G.weteranPo/7200)} minuty, staje się weteranem: póki najedzony, a lud wierny, ma +${Math.round((G.weteranPremia-1)*100)}% siły, szybkości, kopania i modlitwy. Jasna aureola znaczy wzmocnienie, czerwona — osłabienie (świeżo ze skały, okaleczony, zatruty).`,kiedy:"Karta postaci mówi, jaki to stan i kiedy minie. Weterana warto karmić — głodny traci premię.",rycina:dt(I.GOBLIN,"modli")},{id:"straznicy",grupa:"prawa",nazwa:"Strażnicy Snu",lacina:"Custodes somni",opis:"Skorupa ma strażników. Przy 20, 45 i 70% skruszenia wychodzą spod niej fale — z każdą silniejsi. Przenikają skałę, nie odchodzą daleko od rdzenia i biją najpierw rycerzy. Dopóki fala trwa, skorupa nie pęka i nikt nie wejdzie do rdzenia.",kiedy:"W czasie fali pobożni i robotnicy sami odchodzą spod rdzenia — walczą rycerze. Pasek nad płytą mówi, ilu zostało.",rycina:jn},{id:"boss",grupa:"prawa",nazwa:"Śniący Kamień",lacina:"Lapis somnians",opis:"Ostatnia fala, przy 90% skorupy. Wielki strażnik wychodzi ze ściany przedsionka. Rani go tylko rycerz. Na bossa rycerze ruszają dopiero we trzech — mniej czeka z dala od rdzenia (gdy gniazd już nie ma, idą, ilu jest). Co jakiś czas uderza w ziemię i zasypuje kawałek drogi wiernych. Gdy pod rdzeniem modli się trzech pobożnych, słabnie — bez modlitwy się zrasta. Gdy przez 2 minuty nie ma przed nim żadnego rycerza, zapada w ścianę na 4 minuty (skorupa wtedy nie pęka) i we śnie zdradza jedno gniazdo rycerzy. Gdy gniazda są już rozkopane, a rycerzy brak, nie zasypia — wtedy pobożni unoszą księgi i razią go z dystansu.",kiedy:"Wszyscy rycerze pod rdzeń, trzech pobożnych do modlitwy, robotnicy przy drodze. Życie bossa widać na pasku nad płytą.",rycina:jn},{id:"klamry",grupa:"prawa",nazwa:"Klamry",lacina:"Fibulae",opis:"Lud nie spada: nad pustką schodzi powoli, wbijając w ścianę żelazne klamry, a w otwartej pustce wiesza linę. Którędy zszedł, tamtędy wróci.",kiedy:"Klamry widać przy ścianach szybów i jaskiń. Nie trzeba ich budować — powstają same.",rycina:dt(I.GOBLIN,"wspina")},{id:"pauza",grupa:"prawa",nazwa:"Pauza",lacina:"Tempus suspensum",opis:"Czas możesz zatrzymać. Rozkazy wydane w pauzie rysują się jako szkice, rezerwują koszt i dzieją się naraz, gdy puścisz czas.",kiedy:"Zatrzymuj świat, gdy musisz trafić — i przy każdym kryzysie.",rycina:bc},{id:"pismo",grupa:"prawa",nazwa:"Pismo w skale",lacina:"Scriptura ignota",opis:"W skale, do której nikt jeszcze nie zajrzał, widać znaki. Nikt z żyjących ich nie wyrył — były tu przed pierwszym goblinem. Gasną, gdy dojdzie do nich światło; w zatrzymanym czasie widać je wyraźniej.",kiedy:"Nie da się ich przeczytać. Można tylko pójść tam, gdzie są, i patrzeć, jak znikają.",rycina:jc}],Kn=a=>at.find(e=>e.id===a),Ws="trzewia:atlas";class Mc{constructor(){this.znane=new Set,this.kolejka=[],this.niezobaczone=0;try{const e=localStorage.getItem(Ws);if(e)for(const t of JSON.parse(e))this.znane.add(t)}catch{}}zna(e){return this.znane.has(e)}get ile(){return at.filter(e=>this.znane.has(e.id)).length}odkryj(e,t=!0){return this.znane.has(e)||!at.some(i=>i.id===e)?!1:(this.znane.add(e),t?this.kolejka.push(e):this.niezobaczone++,this.zapisz(),!0)}zapisz(){try{localStorage.setItem(Ws,JSON.stringify([...this.znane]))}catch{}}}const Oe=new Mc,Tc=(a,e,t)=>e>=a.x&&e<=a.x+a.w&&t>=a.y&&t<=a.y+a.h,Sc=[[10,"X"],[9,"IX"],[5,"V"],[4,"IV"],[1,"I"]];function Zn(a){let e="";for(const[t,i]of Sc)for(;a>=t;)e+=i,a-=t;return e}function ql(a,e,t,i,o,n=1){a.save(),a.fillStyle="rgba(14,10,9,0.98)",a.fillRect(e,t,i,o),a.strokeStyle=v(P.atrament,.55*n),a.l ak przy jej gnieździe pomaga.","Potem trzech jej wiernych musi stanąć przy samym rdzeniu i modlić się, aż kamień pęknie — kafel po kaflu, zwykle pięć razy.","Gdy skorupa się otworzy, wierni sami zejdą do środka. Kto wierzy i dotknie rdzenia — uwalnia cię. To jest wygrana."]},zagrozenie:{id:"zagrozenie",tytul:"Jak przegrać",rysunek:Wo,linie:["Pod płytą leży wstęga: każda rasa ma w niej swoje pasmo.","Gdy jedna krew zjada resztę, zwycięzcy przestają się bać i przestają o tobie myśleć. Gdy wszyscy giną — nie ma kto myśleć.","Wtedy z góry i z dołu zsuwa się powieka. Gdy się zamknie, zasypiasz — i to jest koniec.","Dlatego karm słabych, osłabiaj silnych i pilnuj, żeby w tobie zawsze ktoś żył. A w tym czasie prowadź jedną nację do rdzenia."]},narzedzia:{id:"narzedzia",tytul:"Czym działasz",rysunek:Co,linie:["Masz trzy ryty: Nakarm, Szepnij i Cud. Płacisz Krwią (z każdej śmierci) i Wiarą (z każdej modlitwy).","Co chwilę coś się dzieje — najazd, zaraza, głód, prorok. Czas wtedy staje, a ty wybierasz, co z tym zrobić.","U dołu płyty zawsze widać, co teraz zrobić, żeby zbliżyć się do wolności. Zaraz pokażę ci wszystko palcem."]},pamiec:{id:"pamiec",tytul:"Ciemność",rysunek:Zl,linie:["Wiesz o sobie tylko tyle, ile wiedzą ci, którzy w tobie chodzą.","Tam, gdzie ktoś właśnie jest, rysunek ma pełną kreskę. Tam, gdzie ktoś był — blaknie i pokazuje stan sprzed pokoleń, nie dzisiejszy.","Tam, gdzie nie ma nikogo, nie ma nawet kreski — sama ciemność.","Drąż im drogi, a będą chodzić dalej. Im dalej chodzą, tym więcej o sobie widzisz."]},zasoby:{id:"zasoby",tytul:"Wiara, krew i oddanie",rysunek:Co,linie:["Nie ma pasków ani liczb. Zasoby są rzeczami, które widzisz w ramie obrazu.","Wiara zbiera się pod sklepieniem jak dym ofiarny. Bierze się z modlitwy przy ołtarzach i kuźniach, a najwięcej z ofiary, którą składają sami.","Krew podnosi się w szczelinie u dołu. Płaci ci ją każda śmierć w twoich trzewiach — cudza wojna jest twoim dochodem.","Złota studnia w ramie to oddanie: jak mocno wierzy w ciebie najwierniejsza nacja. Gdy przekroczy kreskę, jej wierni sami zejdą pod twój rdzeń."]},rasy:{id:"rasy",tytul:"Sześć sposobów istnienia",rysunek:Yc,linie:["Nie ma tu ras lepszych i gorszych. Każda istnieje inaczej i inaczej rośnie.","Ślepy Lud rodzi dzieci i modli się najgorliwiej. Żużlowcy nie rodzą — wykuwają nowych kowali z rudy i żyją z ciepła kuźni.","Prządki nie podbijają, tylko biorą w jarzmo i przerabiają cudze dzieci na swoje. Trolem nikt się nie rodzi: trolem się zostaje, gdy kopie się za głęboko.","Grzybnia nie ma jednostek — rośnie ze zwłok i nie czci cię wcale. Ludzie nie mieszkają w tobie: schodzą z powierzchni po rudę i wracają."]},przyplyw:{id:"przyplyw",tytul:"Przypływ",rysunek:Fl,linie:["Co kilka tysięcy tików coś wchodzi z zewnątrz i tasuje planszę.","Woda znajduje szczelinę i zalewa górne korytarze. Zaraza zabiera połowę sił każdemu. Żyła szaleństwa otwiera kryształ w głębi.","Z powierzchni schodzą ludzie po rudę i sławę — a gdy góra pustoszeje, nowe plemię przychodzi samo, bo pustka przyciąga.","Przypływu nie da się zatrzymać. Można tylko zdecydować, kto po nim zostanie."]},ksztaltuj:{id:"ksztaltuj",tytul:"Kształtuj",rysunek:Bc,linie:["Pierwszy czasownik rusza samą skałę i kosztuje Krew — a Krew bierze się z każdej śmierci w twoich trzewiach.","Drążysz korytarz, żeby ktoś dotarł do rudy albo do sąsiada, z którym ma na pieńku.","Zawalasz strop, żeby kogoś zasypać albo odciąć. Wpuszczasz wodę, żeby utopić tych, którzy nie pływają.","Otwierasz żar, bo Żużlowcy nie postawią kuźni tam, gdzie nie ma ognia. Magma wpuszczona do wody zastyga w kamień i zamyka przejście na zawsze."]},zasiej:{id:"zasiej",tytul:"Zasiej",rysunek:$l,linie:["Nie rozkazujesz im, dokąd mają iść. Kładziesz w skale powód, żeby poszli.","Grzyb to jedzenie, które rośnie samo — i to on wyznacza, ilu Ślepego Ludu góra udźwignie.","Ruda karmi kuźnie: Żużlowcy nie rodzą dzieci, tylko wykuwają nowych kowali za trzy sztuki rudy.","Kości są jedzeniem od ręki i paliwem dla grzybni. Trucizna to kryształ: kto go kopie, wraca z głębi inny."]},szept:{id:"szept",tytul:"Szepcz",rysunek:Xl,linie:["Najtańszy czasownik i jedyny, który dotyka kogoś po imieniu. Płacisz Wiarą.","Dotykasz jednego stworzenia — otwiera się jego karta: rasa, nacja i jedno zdanie o tym, kim jest.",'„Kop w dół" wysyła je głębiej, niż powinno; głębia daje kryształ i szaleństwo. Kto oszaleje do końca, wraca trolem.','„Prorokuj" robi z niego proroka: odchodzi z sześcioma wiernymi i zakłada własną nację, która od razu ma urazę do dawnej.',"To jest twoje główne narzędzie. Wojny nie zaczyna się armią, tylko jedną myślą w jednej głowie."]},znak:{id:"znak",tytul:"Znak",rysunek:Ul,linie:["Jawny cud. Drogi — czterdzieści pięć Wiary — i widzą go wszyscy w promieniu dwudziestu sześciu kafli.",'„Objawienie" podnosi oddanie i gasi strach: modlą się gorliwiej, więc więcej Wiary wraca do ciebie.','„Panika" robi odwrotnie — rozbija oblężenie, wypędza za silną nację z cudzego terenu, ale oddanie spada.',"Po Znaku zostaje w skale świecący glif. Modlitwa przy nim liczy się podwójnie."]},skaz:{id:"skaz",tytul:"Skaź",rysunek:Lc,linie:["Ostatni czasownik zmienia krew całego gatunku i nie da się tego cofnąć.","Płacisz Krwią i Otchłanią: dotykasz jednego przedstawiciela, a zmiana idzie przez wszystkie pokolenia po nim.","Każda skaza ma cenę. Płodność skraca życie i podnosi głód. Żądza krwi daje siłę, ale oni przestają się modlić.","Ślepota spowalnia, za to każda modlitwa liczy się podwójnie. Kamienna skóra daje twardość kosztem kopania."]},spis:{id:"spis",tytul:"Spis ras i Sen",rysunek:Wo,linie:["Pod płytą leży wstęga warstw — tyle miejsca, ile zajmuje każda rasa.","Dopóki warstwy są różne, żyjesz. Gdy jedna zaczyna zjadać wstęgę, zwycięzcy przestają się bać i przestają cię potrzebować.","Wtedy Wiara i Krew wysychają, a z góry i z dołu zaczyna zsuwać się powieka. To twoja jedyna przegrana: zaśnięcie.","Dlatego cała gra polega na jednym: podtrzymuj konflikt, ale nie pozwól nikomu wyginąć."]},kronika:{id:"kronika",tytul:"Kronika",rysunek:Gc,linie:["Gra przez cały czas pisze. Jedna linijka na dole mówi, co się właśnie stało i jak oni to nazwali.","Są trzy końce: zaśnięcie, albo ktoś dojdzie do twojego rdzenia i uklęknie — to wolność — albo dojdzie i nie uklęknie.","W każdym z nich zostaje po tobie kronika — spisana legenda tego, czym byłeś dla tych, którzy w tobie mieszkali.","To jest twój wynik. Teraz zejdź i zobacz, co z tobą zrobią."]}},Tn=`${Math.round(U.oddanieNacji*100)}%`,Dc=[{tytul:"Rozejrzyj się",wstep:"Jesteś górą. W twoich korytarzach mieszkają małe ludy — to na nich patrzysz.",przygotuj:(a,e)=>{const t=e.gniazdoGoblinow();t&&a.pokazMiejsce(t.x,t.y,14,!0)},etapy:[{tekst:"Przeciągnij płytę palcem, żeby się rozejrzeć.",klawisz:"palcem",gest:"przeciagnij",gotowe:(a,e,t)=>(e==null?void 0:e.typ)==="kamera"&&Math.hypot(a.cam.x-t.kamStart.x,a.cam.y-t.kamStart.y)>3},{tekst:"Przybliż i oddal widok.",klawisz:"rozsuń albo zsuń dwa palce",gest:"kolko",gotowe:(a,e,t)=>(e==null?void 0:e.typ)==="kamera"&&e.rodzaj==="zoom"&&Math.abs(Math.log(a.cam.zoom/t.kamStart.zoom))>.25},{tekst:"Dotknij oka pod płytą — kamera wróci do mieszkańców.",klawisz:"kamera",wskaz:a=>a.przycisk("kamera"),gotowe:(a,e)=>(e==null?void 0:e.typ)==="kamera"&&e.rodzaj==="powrot"}],koniec:"To Pobożni — twój lud: pobożni, robotnicy i rycerze. Przy siedzibie stoi ich nazwa i liczba żywych.",czasowniki:[]},{tytul:"Czym płacisz",wstep:"Nad płytą stoją trzy liczby. To wszystko, co musisz śledzić.",przygotuj:a=>{a.sim.krew+=60,a.sim.wiara+=40},etapy:[{tekst:"Wiara rośnie, gdy pobożni się modlą. Krew — z każdej śmierci i z ofiar. Jedzenie leży w spiżarniach. Wiarę i krew wydajesz na ryty, wybory i nowych ze skały.",rozumiem:!0,wskaz:a=>({typ:"obszar",o:Kc(a.gra.plate)})},{tekst:`Oddanie: jak mocno lud w ciebie wierzy. Złota studnia pokazuje to samo — od kreski (${Tn}) pobożni sami idą pod twój rdzeń.`,rozumiem:!0,wskaz:a=>({typ:"obszar",o:Ct(a.gra.plate,a.vh)})}],koniec:"Gdy na coś cię nie stać, ryt po lewej przygasa, a wybór na karcie ma cenę na czerwono.",czasowniki:[]},{tytul:"Lud i jego role",wstep:"Twój lud ma trzy role. Nikt się nie rodzi — nowych wydaje skała.",czasowniki:[],etapy:[{tekst:"Pobożni modlą się i kruszą skorupę rdzenia. Robotnicy kopią drogę, zbierają grzyb i donoszą jedzenie. Rycerze bronią — i walczą ze Strażnikami Snu.",rozumiem:!0,wskaz:a=>({typ:"obszar",o:Gi(a.gra.plate,a.vh)})},{tekst:"Pod paskiem ról wybierasz, kogo wyda skała: robotnika albo pobożnego. Co 20 s wychodzi nowy — za krew, osłabiony przez minutę (czerwona aureola).",rozumiem:!0,wskaz:a=>({typ:"obszar",o:Gi(a.gra.plate,a.vh)})},{tekst:"Kto przeżyje 4 minuty, najedzony, a lud wierzy — staje się weteranem: +30% do wszystkiego i jasna aureola.",rozumiem:!0}],koniec:"Każda postać ma swój zamiar — dotknij jej, a karta powie, co robi i ile jeszcze."},{tytul:"Nakarm ich",wstep:"Nie wydajesz rozkazów. Dajesz im powód, żeby żyli dalej.",przygotuj:a=>{a.sim.krew+=120},czasowniki:["zasiej"],etapy:[{tekst:"Wybierz ryt „Nakarm” po lewej.",klawisz:"zasiej",cofa:!0,wskaz:a=>a.ryt("zasiej"),gotowe:a=>a.ui.verb==="zasiej"},{tekst:"Przeciągnij palcem po zaznaczonym miejscu.",wskaz:a=>{const e=a.miejsceNaGrzyb();return e?{typ:"swiat",cel:e}:null},gotowe:(a,e)=>(e==null?void 0:e.typ)==="moc"&&e.czasownik==="zasiej"}],koniec:"Wyrósł grzyb. Pójdą jeść — im więcej jedzenia, tym więcej ich góra wyżywi."},{tytul:"Zrób cud",wstep:"Cud widzą wszyscy dookoła — i ich wiara w ciebie rośnie.",przygotuj:a=>{a.sim.wiara+=60},czasowniki:["znak"],etapy:[{tekst:"Wybierz ryt „Cud”.",klawisz:"znak",cofa:!0,wskaz:a=>a.ryt("znak"),gotowe:a=>a.ui.verb==="znak"},{tekst:"Dotknij płyty przy gnieździe.",wskaz:a=>{const e=a.gniazdoGoblinow();return e?{typ:"swiat",cel:{x:e.x,y:e.y,r:4,tekst:"dotknij tutaj"}}:null},gotowe:(a,e)=>(e==null?void 0:e.typ)==="moc"&&e.czasownik==="znak"}],koniec:`Oddanie Pobożnych skoczyło w górę — zobacz liczbę nad płytą. Przy ${Tn} sami pójdą pod twój rdzeń.`},{tytul:"Poślij wiernego",wstep:"Sze
