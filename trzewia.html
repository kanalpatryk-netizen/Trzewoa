 śmierć to twoja krew.",rycina:di(R.HUMAN,"idzie")},{id:"rasa-5",grupa:"rasy",nazwa:"Grzybnia",lacina:"Caro in fungum",opis:"Nie ma jednostek i nie czci cię wcale. Rośnie ze zwłok — każda śmierć to paliwo na kilka kafli. Obcym parzy stopy, Ślepemu Ludowi daje jeść.",kiedy:"Wyrasta sama po każdej rzezi. Gdzie jej za dużo, wytnie ją zawał albo woda.",rycina:a0},{id:"ryt-ksztaltuj",grupa:"ryty",nazwa:"Kształtuj",lacina:"Formatio saxi",opis:"Ruszasz samą skałę: drążysz przejście, zawalasz strop, wpuszczasz wodę albo otwierasz żar. Magma wpuszczona do wody zastyga w kamień na zawsze.",kiedy:"Drąż drogę do rudy albo do sąsiada. Zawalaj, gdy ktoś bierze górę.",koszt:`drążenie ${Na("ksztaltuj","draz")}, żar ${Na("ksztaltuj","zar")}`,rycina:_e(Vl)},{id:"ryt-zasiej",grupa:"ryty",nazwa:"Zasiej",lacina:"Semen causae",opis:"Nie rozkazujesz, dokąd iść — kładziesz w skale powód. Grzyb to jedzenie, ruda karmi kuźnie, kości są padliną, a trucizna to kryształ, który miesza w głowie.",kiedy:"Siej przy tych, których jest najmniej. Dosypywanie zwycięzcy przybliża sen.",koszt:`grzyb ${Na("zasiej","grzyb")}, ruda ${Na("zasiej","ruda")}`,rycina:_e(Ql)},{id:"ryt-szept",grupa:"ryty",nazwa:"Szepcz",lacina:"Susurrus",opis:'Dotykasz jednej głowy. „Kop w dół" wysyła głębiej, „zabij swoich" zaczyna schizmę, „prorokuj" robi proroka z własną nacją, „uciekaj" sieje strach.',kiedy:"Prorok w wielkiej nacji to najlepsza broń na monokulturę — i na sen.",koszt:`myśl ${Na("szept","kop")}, prorok ${Na("szept","prorok")}`,rycina:_e($l)},{id:"ryt-znak",grupa:"ryty",nazwa:"Znak",lacina:"Signum manifestum",opis:"Jawny cud widziany w promieniu dwudziestu sześciu kafli. Objawienie podnosi oddanie i gasi strach, panika rozgania. Zostaje glif — modlitwa przy nim liczy się podwójnie.",kiedy:"Stawiaj przy nacji, którą chcesz doprowadzić do rdzenia.",koszt:Na("znak","objawienie"),rycina:_e(xl)},{id:"ryt-skaz",grupa:"ryty",nazwa:"Skaź",lacina:"Macula sanguinis",opis:"Zmieniasz krew całego gatunku na wszystkie pokolenia. Każda skaza ma cenę: płodność skraca życie, żądza odbiera wiarę, ślepota spowalnia, kamień ciąży.",kiedy:"Nieodwracalne. Używaj, gdy wiesz, kogo hodujesz — i po co.",koszt:Na("skaz","slepota"),rycina:_e(_l)},{id:"krew",grupa:"zasoby",nazwa:"Krew",lacina:"Sanguis",opis:"Czerwona rysa pod płytą. Płaci ci ją każda śmierć w twoich trzewiach — cudza wojna jest twoim dochodem.",kiedy:"Wydajesz ją na kształtowanie skały, zasiew i skazę.",rycina:_e(Pt)},{id:"wiara",grupa:"zasoby",nazwa:"Wiara",lacina:"Fides",opis:"Dym ofiarny pod sklepieniem płyty. Rośnie z modlitwy przy ołtarzach, kuźniach i glifach, a najmocniej z ofiary, którą składają sami.",kiedy:'Płacisz nią za szept i Znak. Nacięcie „Znak" u góry płyty mówi, kiedy cię stać.',rycina:_e(Pt)},{id:"otchlan",grupa:"zasoby",nazwa:"Otchłań",lacina:"Abyssus",opis:"Biały kwadrat: tyle ciebie jest nieznane. Rośnie, gdy zapominają i giną. Wydanie jej zasklepia kawałek nieznanego — na zawsze.",kiedy:"Płacisz nią za skazę krwi i truciznę.",rycina:_e(Uo)},{id:"pamiec",grupa:"prawa",nazwa:"Pamięć",lacina:"Memoria",opis:"Widzisz siebie tylko tam, gdzie ktoś jest albo był. Gdzie nikt nie chodzi, rysunek blaknie i pokazuje stan sprzed pokoleń, a potem ciemność.",kiedy:"Drąż drogi, żeby chodzili dalej — wtedy więcej o sobie zobaczysz.",rycina:_e(Uo)},{id:"sen",grupa:"prawa",nazwa:"Sen",lacina:"Somnus",opis:"Jedyna przegrana. Przychodzi z monokultury albo z pustki: powieka schodzi z góry i z dołu płyty. Budzi cię tylko wojna, którą sam rozpętałeś.",kiedy:"Gdy wstęga warstw zaczyna mieć jeden kolor — rozbijaj ją prorokiem, zawałem i cudem.",rycina:_e(bn)},{id:"prorok",grupa:"prawa",nazwa:"Prorok",lacina:"Propheta",opis:'Szept „prorokuj" odrywa od nacji jednego z garstką wiernych. Nowa nacja od razu ma urazę do dawnej — a wojny z twojego szeptu cofają sen.',kiedy:"Najlepiej w największej nacji zwycięskiej krwi.",rycina:i0},{id:"droga",grupa:"prawa",nazwa:"Droga do wolności",lacina:"Via liberationis",opis:"Wygrywasz, gdy wierni przebiją
