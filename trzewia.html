bo woda.",rycina:hl},{id:"ryt-ksztaltuj",grupa:"ryty",nazwa:"Kształtuj",lacina:"Formatio saxi",opis:"Ruszasz samą skałę: drążysz przejście, zawalasz strop, wpuszczasz wodę albo otwierasz żar. Magma wpuszczona do wody zastyga w kamień na zawsze.",kiedy:"Drąż drogę do rudy albo do sąsiada. Zawalaj, gdy ktoś bierze górę.",koszt:`drążenie ${fe("ksztaltuj","draz")}, żar ${fe("ksztaltuj","zar")}`,rycina:Bt(al)},{id:"ryt-zasiej",grupa:"ryty",nazwa:"Zasiej",lacina:"Semen causae",opis:"Nie rozkazujesz, dokąd iść — kładziesz w skale powód. Grzyb to jedzenie, ruda karmi kuźnie, kości są padliną, a trucizna to kryształ, który miesza w głowie.",kiedy:"Siej przy tych, których jest najmniej. Dosypywanie zwycięzcy przybliża sen.",koszt:`grzyb ${fe("zasiej","grzyb")}, ruda ${fe("zasiej","ruda")}`,rycina:Bt(nl)},{id:"ryt-szept",grupa:"ryty",nazwa:"Szepcz",lacina:"Susurrus",opis:'Dotykasz jednej głowy. „Kop w dół" wysyła głębiej, „zabij swoich" zaczyna schizmę, „prorokuj" robi proroka z własną nacją, „uciekaj" sieje strach.',kiedy:"Prorok w wielkiej nacji to najlepsza broń na monokulturę — i na sen.",koszt:`myśl ${fe("szept","kop")}, prorok ${fe("szept","prorok")}`,rycina:Bt(ol)},{id:"ryt-znak",grupa:"ryty",nazwa:"Znak",lacina:"Signum manifestum",opis:"Jawny cud widziany w promieniu dwudziestu sześciu kafli. Objawienie podnosi oddanie i gasi strach, panika rozgania. Zostaje glif — modlitwa przy nim liczy się podwójnie.",kiedy:"Stawiaj przy nacji, którą chcesz doprowadzić do rdzenia.",koszt:fe("znak","objawienie"),rycina:Bt(sl)},{id:"ryt-skaz",grupa:"ryty",nazwa:"Skaź",lacina:"Macula sanguinis",opis:"Zmieniasz krew całego gatunku na wszystkie pokolenia. Każda skaza ma cenę: płodność skraca życie, żądza odbiera wiarę, ślepota spowalnia, kamień ciąży.",kiedy:"Nieodwracalne. Używaj, gdy wiesz, kogo hodujesz — i po co.",koszt:fe("skaz","slepota"),rycina:Bt(rl)},{id:"krew",grupa:"zasoby",nazwa:"Krew",lacina:"Sanguis",opis:"Czerwona rysa pod płytą. Płaci ci ją każda śmierć w twoich trzewiach
