 tą ciemnością. Im więcej o tobie zapomnieli, tym więcej jej masz."]},rasy:{id:"rasy",tytul:"Sześć sposobów istnienia",rysunek:go,linie:["Nie ma tu ras lepszych i gorszych. Każda istnieje inaczej i inaczej rośnie.","Ślepy Lud rodzi dzieci i modli się najgorliwiej. Żużlowcy nie rodzą — wykuwają nowych kowali z rudy i żyją z ciepła kuźni.","Prządki nie podbijają, tylko biorą w jarzmo i przerabiają cudze dzieci na swoje. Trolem nikt się nie rodzi: trolem się zostaje, gdy kopie się za głęboko.","Grzybnia nie ma jednostek — rośnie ze zwłok i nie czci cię wcale. Ludzie nie mieszkają w tobie: schodzą z powierzchni po rudę i wracają."]},przyplyw:{id:"przyplyw",tytul:"Przypływ",rysunek:bo,linie:["Co kilka tysięcy tików coś wchodzi z zewnątrz i tasuje planszę.","Woda znajduje szczelinę i zalewa górne korytarze. Zaraza zabiera połowę sił każdemu. Żyła szaleństwa otwiera kryształ w głębi.","Z powierzchni schodzą ludzie po rudę i sławę — a gdy góra pustoszeje, nowe plemię przychodzi samo, bo pustka przyciąga.","Przypływu nie da się zatrzymać. Można tylko zdecydować, kto po nim zostanie."]},ksztaltuj:{id:"ksztaltuj",tytul:"Kształtuj",rysunek:yo,linie:["Pierwszy czasownik rusza samą skałę i kosztuje Krew — a Krew bierze się z każdej śmierci w twoich trzewiach.","Drążysz korytarz, żeby ktoś dotarł do rudy albo do sąsiada, z którym ma na pieńku.","Zawalasz strop, żeby kogoś zasypać albo odciąć. Wpuszczasz wodę, żeby utopić tych, którzy nie pływają.","Otwierasz żar, bo Żużlowcy nie postawią kuźni tam, gdzie nie ma ognia. Magma wpuszczona do wody zastyga w kamień i zamyka przejście na zawsze."]},zasiej:{id:"zasiej",tytul:"Zasiej",rysunek:co,linie:["Nie rozkazujesz im, dokąd mają iść. Kładziesz w skale powód, żeby poszli.","Grzyb to jedzenie, które rośnie samo — i to on wyznacza, ilu Ślepego Ludu góra udźwignie.","Ruda karmi kuźnie: Żużlowcy nie rodzą dzieci, tylko wykuwają nowych kowali za trzy sztuki rudy.","Kości są jedzeniem od ręki i paliwem dla grzybni. Trucizna to kryształ: kto go kopie, wraca z głębi inny."]},szept:{id:"szept",tytul:"Szepcz",rysunek:uo,linie:["Najtańszy czasownik i jedyny, który dotyka kogoś po imieniu. Płacisz Wiarą.","Dotykasz jednego stworzenia — otwiera się jego karta: rasa, nacja i jedno zdanie o tym, kim jest.",'„Kop w dół" wysyła je głębiej, niż powinno; głębia daje kryształ i szaleństwo. Kto oszaleje do końca, wraca trolem.','„Prorokuj" robi z niego proroka: odchodzi z sześcioma wiernymi i zakłada własną nację, która od razu ma urazę do dawnej.',"To jest twoje główne narzędzie. Wojny nie zaczyna się armią, tylko jedną myślą w jednej głowie."]},znak:{id:"znak",tytul:"Znak",rysunek:ko,linie:["Jawny cud. Drogi — czterdzieści pięć Wiary — i widzą go wszyscy w promieniu dwudziestu sześciu kafli.",'„Objawienie" podnosi oddanie i gasi strach: modlą się gorliwiej, więc więcej Wiary wraca do ciebie.','„Panika" robi odwrotnie — rozbija oblężenie, wypędza za silną nację z cudzego terenu, ale oddanie spada.',"Po Znaku zostaje w skale świecący glif. Modlitwa przy nim liczy się podwójnie."]},skaz:{id:"skaz",tytul:"Skaź",rysunek:zo,linie:["Ostatni czasownik zmienia krew całego gatunku i nie da się tego cofnąć.","Płacisz Krwią i Otchłanią: dotykasz jednego przedstawiciela, a zmiana idzie przez wszystkie pokolenia po nim.","Każda skaza ma cenę. Płodność skraca życie i podnosi głód. Żądza krwi daje siłę, ale oni przestają się modlić.","Ślepota spowalnia, za to każda modlitwa liczy się podwójnie. Kamienna skóra daje twardość kosztem kopania."]},spis:{id:"spis",tytul:"Spis ras i Sen",rysunek:wo,linie:["Pod płytą leży wstęga warstw — tyle miejsca, ile zajmuje każda rasa.","Dopóki warstwy są różne, żyjesz. Gdy jedna zaczyna zjadać wstęgę, zwycięzcy przestają się bać i przestają cię potrzebować.","Wtedy Wiara i Krew wysychają, a z góry i z dołu zaczyna zsuwać się powieka. To twoja jedyna przegrana: zaśnięcie.","Dlatego cała gra polega na jednym: podtrzymuj konflikt, ale nie pozwól nikomu wyginąć."]},kronika:{id:"kronika",tytul:"Kronika" z u góry „grzyb", potem przeciągnij po zaznaczonym miejscu.',poZrobieniu:"Pójdą jeść. Grzyb wyznacza, ilu Ślepego Ludu góra w ogóle udźwignie.",czasowniki:["zasiej"],narzedzie:"grzyb",przygotuj:i=>{i.tempoMnoznik=1,i.sim.krew+=300,i.sim.wiara+=60},cel:i=>this.miejsceNaGrzyb(i),sprawdz:i=>(i==null?void 0:i.typ)==="moc"&&i.czasownik==="zasiej"},{scena:"ksztaltuj",zadanie:"Otwórz im drogę: wydrąż korytarz w zaznaczonej skale.",jak:'Pierwszy ryt po lewej, narzędzie „drąż", i przeciągnij po zaznaczonym kawałku skały. Kosztuje Krew.',poZrobieniu:"Tunel jest twój, ale pójdą nim oni. Tak się prowadzi cudze życie.",czasowniki:["ksztaltuj"],narzedzie:"draz",przygotuj:i=>{i.sim.krew+=300},cel:i=>this.miejsceNaKorytarz(i),sprawdz:i=>(i==null?void 0:i.typ)==="moc"&&i.czasownik==="ksztaltuj"},{scena:"rasy",zadanie:"Popatrz, kto jeszcze w tobie mieszka.",jak:"Pod płytą leży wstęga warstw — jedno pasmo na nację, z podpisem. Kamera pokazuje teraz kogoś innego niż Ślepy Lud.",poZrobieniu:"Każda z nich istnieje inaczej i inaczej ginie. Twoje jedzenie bierze się z ich różnicy.",czasowniki:[],przygotuj:i=>{i.tempoMnoznik=2},cel:i=>this.gniazdoObcych(i),sprawdz:(i,a,n)=>n>3200},{scena:"szept",zadanie:"Zrób proroka: dotknij zaznaczonego stworzenia.",jak:'Trzeci ryt po lewej, potem dotknij zaznaczonej sylwetki. Otworzy się jego karta — wybierz z niej „prorokuj".',poZrobieniu:"Odszedł z wiernymi i założył własną nację. Od tej chwili ma urazę do dawnej — i o to chodziło.",czasowniki:["szept"],stopCzasu:!0,przygotuj:i=>{i.sim.wiara+=150},cel:i=>this.stworzenieDoSzeptu(i),sprawdz:i=>(i==null?void 0:i.typ)==="szept"},{scena:"znak",zadanie:"Zrób im jawny cud: użyj Znaku przy gnieździe.",jak:'Czwarty ryt po lewej, narzędzie „objawienie", i dotknij płyty koło gniazda. Widzą to wszyscy w promieniu dwudziestu sześciu kafli.',poZrobieniu:"Zostaje glif: modlitwa przy nim liczy się podwójnie. Oddanie tej nacji właśnie skoczyło — a oddanie to jedyne, co otwiera rdzeń.",czasowniki:["znak"],narzedzie:"obj
