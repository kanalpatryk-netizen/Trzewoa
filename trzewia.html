nie rodzą — wykuwają nowych kowali z rudy i żyją z ciepła kuźni.","Prządki nie podbijają, tylko biorą w jarzmo i przerabiają cudze dzieci na swoje. Trolem nikt się nie rodzi: trolem się zostaje, gdy kopie się za głęboko.","Grzybnia nie ma jednostek — rośnie ze zwłok i nie czci cię wcale. Ludzie nie mieszkają w tobie: schodzą z powierzchni po rudę i wracają."]},przyplyw:{id:"przyplyw",tytul:"Przypływ",rysunek:so,linie:["Co kilka tysięcy tików coś wchodzi z zewnątrz i tasuje planszę.","Woda znajduje szczelinę i zalewa górne korytarze. Zaraza zabiera połowę sił każdemu. Żyła szaleństwa otwiera kryształ w głębi.","Z powierzchni schodzą ludzie po rudę i sławę — a gdy góra pustoszeje, nowe plemię przychodzi samo, bo pustka przyciąga.","Przypływu nie da się zatrzymać. Można tylko zdecydować, kto po nim zostanie."]},ksztaltuj:{id:"ksztaltuj",tytul:"Kształtuj",rysunek:xn,linie:["Pierwszy czasownik rusza samą skałę i kosztuje Krew — a Krew bierze się z każdej śmierci w twoich trzewiach.","Drążysz korytarz, żeby ktoś dotarł do rudy albo do sąsiada, z którym ma na pieńku.","Zawalasz strop, żeby kogoś zasypać albo odciąć. Wpuszczasz wodę, żeby utopić tych, którzy nie pływają.","Otwierasz żar, bo Żużlowcy nie postawią kuźni tam, gdzie nie ma ognia. Magma wpuszczona do wody zastyga w kamień i zamyka przejście na zawsze."]},zasiej:{id:"zasiej",tytul:"Zasiej",rysunek:$n,linie:["Nie rozkazujesz im, dokąd mają iść. Kładziesz w skale powód, żeby poszli.","Grzyb to jedzenie, które rośnie samo — i to on wyznacza, ilu Ślepego Ludu góra udźwignie.","Ruda karmi kuźnie: Żużlowcy nie rodzą dzieci, tylko wykuwają nowych kowali za trzy sztuki rudy.","Kości są jedzeniem od ręki i paliwem dla grzybni. Trucizna to kryształ: kto go kopie, wraca z głębi inny."]},szept:{id:"szept",tytul:"Szepcz",rysunek:_n,linie:["Najtańszy czasownik i jedyny, który dotyka kogoś po imieniu. Płacisz Wiarą.","Dotykasz jednego stworzenia — otwiera się jego karta: rasa, nacja i jedno zdanie o tym, kim jest.",'„Kop w dół" wysyła je głębiej, niż powinno; głębia daje kryształ i szaleństwo. Kto oszaleje do końca, wraca trolem.','„Prorokuj" robi z niego proroka: odchodzi z sześcioma wiernymi i zakłada własną nację, która od razu ma urazę do dawnej.',"To jest twoje główne narzędzie. Wojny nie zaczyna się armią, tylko jedną myślą w jednej głowie."]},znak:{id:"znak",tytul:"Znak",rysunek:eo,linie:["Jawny cud. Drogi — czterdzieści pięć Wiary — i widzą go wszyscy w promieniu dwudziestu sześciu kafli.",'„Objawienie" podnosi oddanie i gasi strach: modlą się gorliwiej, więc więcej Wiary wraca do ciebie.','„Panika" robi odwrotnie — rozbija oblężenie, wypędza za silną nację z cudzego terenu, ale oddanie spada.',"Po Znaku zostaje w skale świecący glif. Modlitwa przy nim liczy się podwójnie."]},skaz:{id:"skaz",tytul:"Skaź",rysunek:to,linie:["Ostatni czasownik zmienia krew całego gatunku i nie da się tego cofnąć.","Płacisz Krwią i Otchłanią: dotykasz jednego przedstawiciela, a zmiana idzie przez wszystkie pokolenia po nim.","Każda skaza ma cenę. Płodność skraca życie i podnosi głód. Żądza krwi daje siłę, ale oni przestają się modlić.","Ślepota spowalnia, za to każda modlitwa liczy się podwójnie. Kamienna skóra daje twardość kosztem kopania."]},spis:{id:"spis",tytul:"Spis ras i Sen",rysunek:io,linie:["Pod płytą leży wstęga warstw — tyle miejsca, ile zajmuje każda rasa.","Dopóki warstwy są różne, żyjesz. Gdy jedna zaczyna zjadać wstęgę, zwycięzcy przestają się bać i przestają cię potrzebować.","Wtedy Wiara i Krew wysychają, a z góry i z dołu zaczyna zsuwać się powieka. To twoja jedyna przegrana: zaśnięcie.","Dlatego cała gra polega na jednym: podtrzymuj konflikt, ale nie pozwól nikomu wyginąć."]},kronika:{id:"kronika",tytul:"Kronika",rysunek:ao,linie:["Gra przez cały czas pisze. Jedna linijka na dole mówi, co się właśnie stało i jak oni to nazwali.","Wygranej nie ma. Są trzy końce: zaśnięcie, albo ktoś dokopie się do twojego rdzenia i uklęknie, albo dokopie się i nie uklęknie.","W każdym z nich zostaje po tobie kronika — spisana legenda tego, czym byłeś dla tych, którzy w tobie mieszkali.","To jest twój wynik. Teraz zejdź i zobacz, co z tobą zrobią."]}};class lo{constructor(e){this.app=e,this.nazwa="samouczek",this.film=new qn,this.krokIdx=0,this.faza="scena",this.msKroku=0,this.zrobione=!1,this.blysk=0,this.dalejRect=null,this.kroki=[{scena:"kimJestes",zadanie:"Znajdź swoich mieszkańców.",jak:"Przeciągnij płytę, kółkiem przybliż. Przy gnieździe zobaczysz podpis nacji — to oni w tobie mieszkają.",poZrobieniu:"To Ślepy Lud. Przy każdym gnieździe stoi imię nacji i liczba żywych.",czasowniki:[],cel:i=>{const a=this.gniazdoGoblinow(i);return a?{x:a.x,y:a.y,r:6,tekst:"gniazdo Ślepego Ludu"}:null},sprawdz:(i,a,n)=>(i==null?void 0:i.typ)==="kamera"||n>9e3},{scena:"pamiec",zadanie:"Popatrz, jak rysunek ciebie sam się dopisuje.",jak:"Ciemność to miejsca, o których nikt nie pamięta. Gdzie chodzą — tam wychodzi kreska, a gdy odejdą, rysunek blaknie. Nie musisz nic robić.",poZrobieniu:"Widzisz sam siebie tylko tam, gdzie ktoś właśnie jest albo był.",czasowniki:[],przygotuj:i=>{i.tempoMnoznik=2},sprawdz:(i,a,n)=>n>2500},{scena:"zasoby",zadanie:"Popatrz na trzy organy w ramie obrazu.",jak:"Na dole rysa z Krwią — rośnie z każdej śmierci. Pod sklepieniem dym Wiary — z modlitwy. Otchłań to sama ciemność: tyle, ile o tobie zapomniano. Liczb nie ma i nie będzie.",poZrobieniu:"Krew płaci za skałę, Wiara za szept i cud, Otchłań za skażenie krwi. Kiedy nie wiesz, czy cię stać — ryt po lewej gaśnie.",czasowniki:[],przygotuj:i=>{i.tempoMnoznik=1,i.sim.krew+=120,i.sim.wiara+=40},sprawdz:(i,a,n)=>n>3200},{scena:"zasiej",zadanie:"Nakarm ich: zasiej grzyb w zaznaczonym miejscu.",jak:'Dotknij drugiego rytu po lewej, wybierz u góry „grzyb", potem przeciągnij po zaznaczonym miejscu.',poZrobieniu:"Pójdą jeść. Grzyb wyznacza, ilu Ślepego Ludu góra w ogóle udźwignie.",czasowniki:["zasiej"],narzedzie:"grzyb",przygotuj:i=>{i.tempoMnoznik=1,i.sim.krew+=300,i.sim.wiara+=60},cel:i=>this.miejsceNaGrzyb
