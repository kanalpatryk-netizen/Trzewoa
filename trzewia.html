"rgba(240,220,180,0.8)",3),e.fillStyle="rgba(240,220,180,0.8)",e.fillRect(r-1,s-o*.04,2,o*.3),e.restore()}const Re=[{id:"rasa-0",grupa:"rasy",nazwa:"Ślepy Lud",lacina:"Gens caeca",opis:"Jedyni, którzy rodzą dzieci. Modlą się najgorliwiej i sami składają ci w ofierze własne potomstwo. Ile ich jest, zależy wprost od grzyba i padliny w zasięgu.",kiedy:"Karm ich grzybem, gdy głodują. Gdy biorą górę — prorok w ich największej nacji zrobi rozłam.",rycina:Be(S.GOBLIN,"modli")},{id:"rasa-1",grupa:"rasy",nazwa:"Żużlowcy",lacina:"Fabri scoriae",opis:"Nie rodzą się — wykuwa się ich w kuźni z trzech bryłek rudy. Żyją z ciepła ognia i giną, gdy kuźnia wygaśnie. Obłęd głębi ima się ich słabiej niż innych.",kiedy:"Zasiej rudę przy ich kuźni. Gdy nie mają ciepła, otwórz żar obok — nigdy pod nogami.",rycina:Be(S.DWARF,"kopie")},{id:"rasa-2",grupa:"rasy",nazwa:"Trole",lacina:"Qui nimis fodit",opis:"Trolem nikt się nie rodzi — zostaje nim ten, kto kopał za głęboko i wrócił inny. Silny, powolny, nie czci nikogo. Głodny poluje, a gdy nie ma na kogo, zasypia w skale.",kiedy:'Chcesz trola? Szepnij „kop w dół" komuś, kto już siedzi głęboko.',rycina:Be(S.TROLL,"stoi",.95)},{id:"rasa-3",grupa:"rasy",nazwa:"Prządki",lacina:"Textrices servorum",opis:"Nie podbijają — przejmują. Biorą słabszych w jarzmo, przerabiają cudze dzieci na swoje, a głodne wysysają tych, których wzięły. Rosną wyłącznie cudzym kosztem.",kiedy:"Potrzebują sąsiadów słabszych od siebie. Kości przy gnieździe przetrzymają głód.",rycina:Be(S.SPINNER,"stoi",.8)},{id:"rasa-4",grupa:"rasy",nazwa:"Ludzie",lacina:"Advenae superni",opis:"Nie mieszkają w tobie. Schodzą z powierzchni po rudę i sławę, zabierają, co znajdą, i wracają na górę. Nie liczą się do wstęgi warstw.",kiedy:"Zawał odetnie im drogę, a każda ich śmierć to twoja krew.",rycina:Be(S.HUMAN,"idzie")},{id:"rasa-5",grupa:"rasy",nazwa:"Grzybnia",lacina:"Caro in fungum",opis:"Nie ma jednostek i nie czci cię wcale. Rośnie ze zwłok — każda śmierć to paliwo na kilka kafli. Obcym parzy stopy, Ślepemu Ludowi daje jeść.",kiedy:"Wyrasta sama po każdej rzezi. Gdzie jej za dużo, wytnie ją zawał albo woda.",rycina:Pr},{id:"ryt-ksztaltuj",grupa:"ryty",nazwa:"Kształtuj",lacina:"Formatio saxi",opis:"Ruszasz samą skałę: drążysz przejście, zawalasz strop, wpuszczasz wodę albo otwierasz żar. Magma wpuszczona do wody zastyga w kamień na zawsze.",kiedy:"Drąż drogę do rudy albo do sąsiada. Zawalaj, gdy ktoś bierze górę.",koszt:`drążenie ${oe("ksztaltuj","draz")}, żar ${oe("ksztaltuj","zar")}`,rycina:Ct(Mr)},{id:"ryt-zasiej",grupa:"ryty",nazwa:"Zasiej",lacina:"Semen causae",opis:"Nie rozkazujesz, dokąd iść — kładziesz w skale powód. Grzyb to jedzenie, ruda karmi kuźnie, kości są padliną, a trucizna to kryształ, który miesza w głowie.",kiedy:"Siej przy tych, których jest najmniej. Dosypywanie zwycięzcy przybliża sen.",koszt:`grzyb ${oe("zasiej","grzyb")}, ruda ${oe("zasiej","ruda")}`,rycina:Ct(jr)},{id:"ryt-szept",grupa:"ryty",nazwa:"Szepcz",lacina:"Susurrus",opis:'Dotykasz jednej głowy. „Kop w dół" wysyła głębiej, „zabij swoich" zaczyna schizmę, „prorokuj" robi proroka z własną nacją, „uciekaj" sieje strach.',kiedy:"Prorok w wielkiej nacji to najlepsza broń na monokulturę — i na sen.",koszt:`myśl ${oe("szept","kop")}, prorok ${oe("szept","prorok")}`,rycina:Ct(Tr)},{id:"ryt-znak",grupa:"ryty",nazwa:"Znak",lacina:"Signum manifestum",opis:"Jawny cud widziany w promieniu dwudziestu sześciu kafli. Objawienie podnosi oddanie i gasi strach, panika rozgania. Zostaje glif — modlitwa przy nim liczy się podwójnie.",kiedy:"Stawiaj przy nacji, którą chcesz doprowadzić do rdzenia.",koszt:oe("znak","objawienie"),rycina:Ct(Sr)},{id:"ryt-skaz",grupa:"ryty",nazwa:"Skaź",lacina:"Macula sanguinis",opis:"Zmieniasz krew całego gatunku na wszystkie pokolenia. Każda skaza ma cenę: płodność skraca życie, żądza odbiera wiarę, ślepota spowalnia, kamień ciąży.",kiedy:"Nieodwracalne. Używaj, gdy wiesz, kogo hodujesz — i po co.",koszt:oe("skaz","slepota"),rycina:Ct(Ar)},{id:"krew",grupa:"zasoby",nazwa:"Krew",lacina:"Sanguis",opis:"Czerwona rysa pod płytą. Płaci ci ją każda śmierć w twoich trzewiach — cudza wojna jest twoim dochodem.",kiedy:"Wydajesz ją na kształtowanie skały, zasiew i skazę.",rycina:Ct(Fa)},{id:"wiara",grupa:"zasoby",nazwa:"Wiara",lacina:"Fides",opis:"Dym ofiarny pod sklepieniem płyty. Rośnie z modlitwy przy ołtarzach, kuźniach i glifach, a najmocniej z ofiary, którą składają sami.",kiedy:'Płacisz nią za szept i Znak. Nacięcie „Znak" u góry płyty mówi, kiedy cię stać.',rycina:Ct(Fa)},{id:"otchlan",grupa:"zasoby",nazwa:"Otchłań",lacina:"Abyssus",opis:"Biały kwadrat: tyle ciebie jest nieznane. Rośnie, gdy zapominają i giną. Wydanie jej zasklepia kawałek nieznanego — na zawsze.",kiedy:"Płacisz nią za skazę krwi i truciznę.",rycina:Ct(Xa)},{id:"pamiec",grupa:"prawa",nazwa:"Pamięć",lacina:"Memoria",opis:"Widzisz siebie tylko tam, gdzie ktoś jest albo był. Gdzie nikt nie chodzi, rysunek blaknie i pokazuje stan sprzed pokoleń, a potem ciemność.",kiedy:"Drąż drogi, żeby chodzili dalej — wtedy więcej o sobie zobaczysz.",rycina:Ct(Xa)},{id:"sen",grupa:"prawa",nazwa:"Sen",lacina:"Somnus",opis:"Jedyna przegrana. Przychodzi z monokultury albo z pustki: powieka schodzi z góry i z dołu płyty. Budzi cię tylko wojna, którą sam rozpętałeś.",kiedy:"Gdy wstęga warstw zaczyna mieć jeden kolor — rozbijaj ją prorokiem, zawałem i cudem.",rycina:Ct(vr)},{id:"prorok",grupa:"prawa",nazwa:"Prorok",lacina:"Propheta",opis:'Szept „prorokuj" odrywa od nacji jednego z garstką wiernych. Nowa nacja od razu ma urazę do dawnej — a wojny z twojego szeptu cofają sen.',kiedy:"Najlepiej w największej nacji zwycięskiej krwi.",rycina:Ir},{id:"rdzen",grupa:"prawa",nazwa:"Rdzeń",lacina:"Cor montis",opis:"Bije na dnie, zamknięty w skorupie, której nie rozkuje żaden kilof. Pęka tylko pod modlitwą wiernych. Kto dojdzie do środka — uklęknie i cię uwolni albo zabije.",kiedy:"Prowadź do niego jedną wierną nację: Znak, grzyb przy przedsionku, droga w obie strony.",rycina:Ct(jn)},
