głębi ima się ich słabiej niż innych.",kiedy:"Zasiej rudę przy ich kuźni. Gdy nie mają ciepła, otwórz żar obok — nigdy pod nogami.",rycina:De(P.DWARF,"kopie")},{id:"rasa-2",grupa:"rasy",nazwa:"Trole",lacina:"Qui nimis fodit",opis:"Trolem nikt się nie rodzi — zostaje nim ten, kto kopał za głęboko i wrócił inny. Silny, powolny, nie czci nikogo. Głodny poluje, a gdy nie ma na kogo, zasypia w skale.",kiedy:'Chcesz trola? Szepnij „kop w dół" komuś, kto już siedzi głęboko.',rycina:De(P.TROLL,"stoi",.95)},{id:"rasa-3",grupa:"rasy",nazwa:"Prządki",lacina:"Textrices servorum",opis:"Nie podbijają — przejmują. Biorą słabszych w jarzmo, przerabiają cudze dzieci na swoje, a głodne wysysają tych, których wzięły. Rosną wyłącznie cudzym kosztem.",kiedy:"Potrzebują sąsiadów słabszych od siebie. Kości przy gnieździe przetrzymają głód.",rycina:De(P.SPINNER,"stoi",.8)},{id:"rasa-4",grupa:"rasy",nazwa:"Ludzie",lacina:"Advenae superni",opis:"Nie mieszkają w tobie. Schodzą z powierzchni po rudę i sławę, zabierają, co znajdą, i wracają na górę. Nie liczą się do wstęgi warstw.",kiedy:"Zawał odetnie im drogę, a każda ich śmierć to twoja krew.",rycina:De(P.HUMAN,"idzie")},{id:"rasa-5",grupa:"rasy",nazwa:"Grzybnia",lacina:"Caro in fungum",opis:"Nie ma jednostek i nie czci cię wcale. Rośnie ze zwłok — każda śmierć to paliwo na kilka kafli. Obcym parzy stopy, Ślepemu Ludowi daje jeść.",kiedy:"Wyrasta sama po każdej rzezi. Gdzie jej za dużo, wytnie ją zawał albo woda.",rycina:gl},{id:"ryt-ksztaltuj",grupa:"ryty",nazwa:"Kształtuj",lacina:"Formatio saxi",opis:"Ruszasz samą skałę: drążysz przejście, zawalasz strop, wpuszczasz wodę albo otwierasz żar. Magma wpuszczona do wody zastyga w kamień na zawsze.",kiedy:"Drąż drogę do rudy albo do sąsiada. Zawalaj, gdy ktoś bierze górę.",koszt:`drążenie ${ue("ksztaltuj","draz")}, żar ${ue("ksztaltuj","zar")}`,rycina:Lt(cl)},{id:"ryt-zasiej",grupa:"ryty",nazwa:"Zasiej",lacina:"Semen causae",opis:"Nie rozkazujesz, dokąd iść — kładziesz w skale powód. Grzyb to jedzenie, ruda karmi kuźnie, kości są padliną, a trucizna to kryształ, który miesza w głowie.",kiedy:"Siej przy tych, których jest najmniej. Dosypywanie zwycięzcy przybliża sen.",koszt:`grzyb ${ue("zasiej","grzyb")}, ruda ${ue("zasiej","ruda")}`,rycina:Lt(kl)},{id:"ryt-szept",grupa:"ryty",nazwa:"Szepcz",lacina:"Susurrus",opis:'Dotykasz jednej głowy. „Kop w dół" wysyła głębiej, „zabij swoich" zaczyna schizmę, „prorokuj" robi proroka z własną nacją, „uciekaj" sieje strach.',kiedy:"Prorok w wielkiej nacji to najlepsza broń na monokulturę — i na sen.",koszt:`myśl ${ue("szept","kop")}, prorok ${ue("szept","prorok")}`,rycina:Lt(zl)},{id:"ryt-znak",grupa:"ryty",nazwa:"Znak",lacina:"Signum manifestum",opis:"Jawny cud widziany w promieniu dwudziestu sześciu kafli. Objawienie podnosi oddanie i gasi strach, panika rozgania. Zostaje glif — modlitwa przy nim liczy się podwójnie.",kiedy:"Stawiaj przy nacji, którą chcesz doprowadzić do rdzenia.",koszt:ue("znak","objawienie"),rycina:Lt(pl)},{id:"ryt-skaz",grupa:"ryty",nazwa:"Skaź",lacina:"Macula sanguinis",opis:"Zmieniasz krew całego gatunku na wszystkie pokolenia. Każda skaza ma cenę: płodność skraca życie, żądza odbiera wiarę, ślepota spowalnia, kamień ciąży.",kiedy:"Nieodwracalne. Używaj, gdy wiesz, kogo hodujesz — i po co.",koszt:ue("skaz","slepota"),rycina:Lt(wl)},{id:"krew",grupa:"zasoby",nazwa:"Krew",lacina:"Sanguis",opis:"Czerwona rysa pod płytą. Płaci ci ją każda śmierć w twoich trzewiach — cudza wojna jest twoim dochodem.",kiedy:"Wydajesz ją na kształtowanie skały, zasiew i skazę.",rycina:Lt(ea)},{id:"wiara",grupa:"zasoby",nazwa:"Wiara",lacina:"Fides",opis:"Dym ofiarny pod sklepieniem płyty. Rośnie z modlitwy przy ołtarzach, kuźniach i glifach, a najmocniej z ofiary, którą składają sami.",kiedy:'Płacisz nią za szept i Znak. Nacięcie „Znak" u góry płyty mówi, kiedy cię stać.',rycina:Lt(ea)},{id:"otchlan",grupa:"zasoby",nazwa:"Otchłań",lacina:"Abyssus",opis:"Biały kwadrat: tyle ciebie jest nieznane. Rośnie, gdy zapominają i giną. Wydanie jej zasklepia kawałek nieznanego — na zawsze.",kiedy:"Płacisz nią za skazę krwi i truciznę.",rycina:Lt(pn)},{id:"pamiec",grupa:"prawa",nazwa:"Pamięć",lacina:"Memoria",opis:"Widzisz siebie tylko tam, gdzie ktoś jest albo był. Gdzie nikt nie chodzi, rysunek blaknie i pokazuje stan sprzed pokoleń, a potem ciemność.",kiedy:"Drąż drogi, żeby chodzili dalej — wtedy więcej o sobie zobaczysz.",rycina:Lt(pn)},{id:"sen",grupa:"prawa",nazwa:"Sen",lacina:"Somnus",opis:"Jedyna przegrana. Przychodzi z monokultury albo z pustki: powieka schodzi z góry i z dołu płyty. Budzi cię tylko wojna, którą sam rozpętałeś.",kiedy:"Gdy wstęga warstw zaczyna mieć jeden kolor — rozbijaj ją prorokiem, zawałem i cudem.",rycina:Lt(Zn)},{id:"prorok",grupa:"prawa",nazwa:"Prorok",lacina:"Propheta",opis:'Szept „prorokuj" odrywa od nacji jednego z garstką wiernych. Nowa nacja od razu ma urazę do dawnej — a wojny z twojego szeptu cofają sen.',kiedy:"Najlepiej w największej nacji zwycięskiej krwi.",rycina:bl},{id:"droga",grupa:"prawa",nazwa:"Droga do wolności",lacina:"Via liberationis",opis:"Wygrywasz, gdy wierni przebiją skorupę rdzenia i uklękną przy nim. Po kolei: ktoś musi się modlić (wiara); jedna nacja musi uwierzyć mocno — Znak przy jej gnieździe (oddanie); przy przedsionku pod rdzeniem musi rosnąć grzyb, żeby jej warta przeżyła na dole (droga); warta modli się przy rdzeniu, aż skorupa pęknie (skorupa); potem wierni sami wchodzą do środka. Szczegóły: tablice Skorupa i Rdzeń.",kiedy:"Kroki widać w lewym górnym rogu płyty. Po drodze nie daj górze zasnąć: nikt nie może wymrzeć ani zjeść reszty.",rycina:Tl},{id:"skorupa",grupa:"prawa",nazwa:"Skorupa rdzenia",lacina:"Testa cordis",opis:"Kamień wokół rdzenia — nie wydrążysz go ani nie zawalisz. Pęka tylko pod modlitwą: gdy przy rdzeniu (do 16 kafli) stoi naraz co najmniej trzech wiernych jednej nacji, każdy z oddaniem od 35%. Postęp zostaje przy nacji. Każde pęknięcie wyjmuje jeden kafel od strony, z której się modlą — góra, dół albo bok; zwykle trzeba ich około pięciu, każde idzie wolniej od poprzedniego.",kiedy:'Trzymaj trzech i więcej razem, najedzonych i wierzących. Postęp widać na plakietce: „skorupa 2/5". Prorok dzieli wartę — nie teraz.',rycina:Sl},{id:"rdzen",grupa:"prawa",nazwa:"Rdzeń",lacina:"Cor montis",opis:"Gdy przez skorupę prowadzi przejście, wierni sami schodzą do środka — nie musisz ich prowadzić. Kto dotknie rdzenia albo wejdzie do pustej komory wokół niego, kończy grę: wierzący (nacja ponad 55% albo on sam ponad 70%) cię uwalnia, bezbożny zabija.",kiedy:"Pilnuj przejścia: nie zalewaj go i nie zawalaj, a bezbożnych trzymaj od niego z dala.",rycina:Lt(Hn)},{id:"pielgrzymka",grupa:"prawa",nazwa:"Pielgrzymka",lacina:"Peregrinatio",opis:"Gdy nacja wierzy mocno, najwyżej pięciu najwierniejszych schodzi pod rdzeń i modli się pod skorupą. Schodzą, gdy przy przedsionku jest co jeść albo gdy spod rdzenia da się wrócić do gniazda.",kiedy:"Zasiej grzyb przy przedsionku — gdzie nie ma przejścia, wierni przekopią się sami. Jeśli chcesz, żeby wracali do gniazda, wydrąż im korytarz wzdłuż złotej kreski.",rycina:Ml},{id:"przyplyw",grupa:"prawa",nazwa:"Przypływ",lacina:"Aestus",opis:"Co jakiś czas coś wchodzi z zewnątrz: woda, zaraza, żyła szaleństwa albo ludzie. Gdy góra pustoszeje, nowe plemię schodzi samo.",kiedy:"Przypływu nie zatrzymasz. Zdecyduj, kto po nim zostanie.",rycina:Lt(ml)},{id:"pauza",grupa:"prawa",nazwa:"Pauza",lacina:"Tempus suspensum",opis:"Czas możesz zatrzymać. Rozkazy wydane w pauzie rysują się jako szkice, rezerwują koszt i dzieją się naraz, gdy puścisz czas.",kiedy:"Zatrzymuj świat, gdy musisz trafić — i przy każdym kryzysie.",rycina:jl},{id:"pismo",grupa:"prawa",nazwa:"Pismo w skale",lacina:"Scriptura ignota",opis:"W skale, do której nikt jeszcze nie zajrzał, widać znaki. Nikt z żyjących ich nie wyrył — były tu przed pierwszym goblinem. Gasną, gdy dojdzie do nich światło; w zatrzymanym czasie widać je wyraźniej.",kiedy:"Nie da się ich przeczytać. Można tylko pójść tam, gdzie s
