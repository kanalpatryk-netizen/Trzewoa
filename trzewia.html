ia.",koszt:Na("znak","objawienie"),rycina:ea(Jn)},{id:"ryt-skaz",grupa:"ryty",nazwa:"Skaź",lacina:"Macula sanguinis",opis:"Zmieniasz krew całego gatunku na wszystkie pokolenia. Każda skaza ma cenę: płodność skraca życie, żądza odbiera wiarę, ślepota spowalnia, kamień ciąży.",kiedy:"Nieodwracalne. Używaj, gdy wiesz, kogo hodujesz — i po co.",koszt:Na("skaz","slepota"),rycina:ea(Vn)},{id:"krew",grupa:"zasoby",nazwa:"Krew",lacina:"Sanguis",opis:"Czerwona rysa pod płytą. Płaci ci ją każda śmierć w twoich trzewiach — cudza wojna jest twoim dochodem.",kiedy:"Wydajesz ją na kształtowanie skały, zasiew i skazę.",rycina:ea(tt)},{id:"wiara",grupa:"zasoby",nazwa:"Wiara",lacina:"Fides",opis:"Dym ofiarny pod sklepieniem płyty. Rośnie z modlitwy przy ołtarzach, kuźniach i glifach, a najmocniej z ofiary, którą składają sami.",kiedy:'Płacisz nią za szept i Znak. Nacięcie „Znak" u góry płyty mówi, kiedy cię stać.',rycina:ea(tt)},{id:"otchlan",grupa:"zasoby",nazwa:"Otchłań",lacina:"Abyssus",opis:"Biały kwadrat: tyle ciebie jest nieznane. Rośnie, gdy zapominają i giną. Wydanie jej zasklepia kawałek nieznanego — na zawsze.",kiedy:"Płacisz nią za skazę krwi i truciznę.",rycina:ea(Ut)},{id:"pamiec",grupa:"prawa",nazwa:"Pamięć",lacina:"Memoria",opis:"Widzisz siebie tylko tam, gdzie ktoś jest albo był. Gdzie nikt nie chodzi, rysunek blaknie i pokazuje stan sprzed pokoleń, a potem ciemność.",kiedy:"Drąż drogi, żeby chodzili dalej — wtedy więcej o sobie zobaczysz.",rycina:ea(Ut)},{id:"sen",grupa:"prawa",nazwa:"Sen",lacina:"Somnus",opis:"Jedyna przegrana. Przychodzi z monokultury albo z pustki: powieka schodzi z góry i z dołu płyty. Budzi cię tylko wojna, którą sam rozpętałeś.",kiedy:"Gdy wstęga warstw zaczyna mieć jeden kolor — rozbijaj ją prorokiem, zawałem i cudem.",rycina:ea(Xt)},{id:"prorok",grupa:"prawa",nazwa:"Prorok",lacina:"Propheta",opis:'Szept „prorokuj" odrywa od nacji jednego z garstką wiernych. Nowa nacja od razu ma urazę do dawnej — a wojny z twojego szeptu cofają sen.',kiedy:" emiem — górą, która śni.","Korytarze są twoimi żyłami, jaskinie płucami, a na samym dnie bije rdzeń: twoje serce, zamknięte w kamieniu.","W tobie mieszkają rasy. Żywisz się tym, że o tobie myślą: ich modlitwą, ich strachem i ich śmiercią.","Nie rozkazujesz im. Zmieniasz skałę, w której żyją, i szepczesz im do głów — a one robią resztę."]},cel:{id:"cel",tytul:"Jak się uwolnić",rysunek:H0,linie:["Twój rdzeń jest uwięziony w skorupie. Nie rozkuje jej żaden kilof i żadna twoja moc.","Pęka tylko od modlitwy. Najpierw jedna nacja musi uwierzyć w ciebie mocno — Znak przy jej gnieździe pomaga.","Potem trzech jej wiernych musi stanąć przy samym rdzeniu i modlić się, aż kamień pęknie — kafel po kaflu, zwykle pięć razy.","Gdy skorupa się otworzy, wierni sami zejdą do środka. Kto wierzy i dotknie rdzenia — uwalnia cię. To jest wygrana."]},zagrozenie:{id:"zagrozenie",tytul:"Jak przegrać",rysunek:Xt,linie:["Pod płytą leży wstęga: każda rasa ma w niej swoje pasmo.","Gdy jedna krew zjada resztę, zwycięzcy przestają się bać i przestają o tobie myśleć. Gdy wszyscy giną — nie ma kto myśleć.","Wtedy z góry i z dołu zsuwa się powieka. Gdy się zamknie, zasypiasz — i to jest koniec.","Dlatego karm słabych, osłabiaj silnych i pilnuj, żeby w tobie zawsze ktoś żył. A w tym czasie prowadź jedną nację do rdzenia."]},narzedzia:{id:"narzedzia",tytul:"Czym działasz",rysunek:tt,linie:["Masz pięć rytów: Kształtuj skałę, Zasiej jedzenie i rudę, Szepnij komuś myśl, postaw Znak, Skaź całą krew.","Płacisz Krwią, która przybywa z każdą śmiercią, Wiarą z modlitw i Otchłanią z zapomnienia.","Spacja zatrzymuje czas: w pauzie planujesz rozkazy, a dzieją się naraz, gdy puścisz. Gra sama staje przy kryzysach.","Nad płytą zawsze stoi jedno zdanie — co teraz najpilniejsze. A w rogu płyty widać, ile zostało do wolności. Zaraz pokażę ci wszystko palcem."]},pamiec:{id:"pamiec",tytul:"Ciemność i Otchłań",rysunek:Ut,linie:["Wiesz o sobie tylko tyle, ile wiedzą ci, którzy w tobie chodzą.","Tam, gdzie ktoś właśnie jest, rysunek ma pełną kreskę. Tam, gdzie ktoś był — blaknie i pokazuje stan sprzed pokoleń, nie dzisiejszy.","Tam, gdzie nie ma nikogo, nie ma nawet kreski — sama ciemność. To Otchłań: twój trzeci zasób, ten, którego nie widać.","Otchłań rośnie, gdy zapominają i giną. Wydanie jej zasklepia kawałek nieznanego — na zawsze."]},zasoby:{id:"zasoby",tytul:"Trzy zasoby",rysunek:tt,linie:["Nie ma pasków ani liczb. Zasoby są rzeczami, które widzisz w ramie obrazu.","Wiara zbiera się pod sklepieniem jak dym ofiarny. Bierze się z modlitwy przy ołtarzach i kuźniach, a najwięcej z ofiary, którą składają sami.","Krew podnosi się w szczelinie u dołu. Płaci ci ją każda śmierć w twoich trzewiach — cudza wojna jest twoim dochodem.","Otchłań nie ma wskaźnika, bo jest tą ciemnością. Im więcej o tobie zapomnieli, tym więcej jej masz."]},rasy:{id:"rasy",tytul:"Sześć sposobów istnienia",rysunek:F0,linie:["Nie ma tu ras lepszych i gorszych. Każda istnieje inaczej i inaczej rośnie.","Ślepy Lud rodzi dzieci i modli się najgorliwiej. Żużlowcy nie rodzą — wykuwają nowych kowali z rudy i żyją z ciepła kuźni.","Prządki nie podbijają, tylko biorą w jarzmo i przerabiają cudze dzieci na swoje. Trolem nikt się nie rodzi: trolem się zostaje, gdy kopie się za głęboko.","Grzybnia nie ma jednostek — rośnie ze zwłok i nie czci cię wcale. Ludzie nie mieszkają w tobie: schodzą z powierzchni po rudę i wracają."]},przyplyw:{id:"przyplyw",tytul:"Przypływ",rysunek:Qn,linie:["Co kilka tysięcy tików coś wchodzi z zewnątrz i tasuje planszę.","Woda znajduje szczelinę i zalewa górne korytarze. Zaraza zabiera połowę sił każdemu. Żyła szaleństwa otwiera kryształ w głębi.","Z powierzchni schodzą ludzie po rudę i sławę — a gdy góra pustoszeje, nowe plemię przychodzi samo, bo pustka przyciąga.","Przypływu nie da się zatrzymać. Można tylko zdecydować, kto po nim zostanie."]},ksztaltuj:{id:"ksztaltuj",tytul:"Kształtuj",rysunek:Fn,linie:["Pierwszy czasownik rusza samą skałę i kosztuje Krew — a Krew bierze się z każdej śmierci w twoich trzewiach.","Drążysz korytarz, żeby ktoś dotarł do rudy albo do sąsiada, z którym ma na pieńku.","Zawalasz strop, żeby kogoś zasypać albo odciąć. Wpuszczasz wodę, żeby utopić tych, którzy nie pływają.","Otwierasz żar, bo Żużlowcy nie postawią kuźni tam, gdzie nie ma ognia. Magma wpuszczona do wody zastyga w kamień i zamyka przejście na zawsze."]},zasiej:{id:"zasiej",tytul:"Zasiej",rysunek:Hn,linie:["Nie rozkazujesz im, dokąd mają iść. Kładziesz w skale powód, żeby poszli.","Grzyb to jedzenie, które rośnie samo — i to on wyznacza, ilu Ślepego Ludu góra udźwignie.","Ruda karmi kuźnie: Żużlowcy nie rodzą dzieci, tylko wykuwają nowych kowali za trzy sztuki rudy.","Kości są jedzeniem od ręki i paliwem dla grzybni. Trucizna to kryształ: kto go kopie, wraca z głębi inny."]},szept:{id:"szept",tytul:"Szepcz",rysunek:qn,linie:["Najtańszy czasownik i jedyny, który dotyka kogoś po imieniu. Płacisz Wiarą.","Dotykasz jednego stworzenia — otwiera się jego karta: rasa, nacja i jedno zdanie o tym, kim jest.",'„Kop w dół" wysyła je głębiej, niż powinno; głębia daje kryształ i szaleństwo. Kto oszaleje do końca, wraca trolem.','„Prorokuj" robi z niego proroka: odchodzi z sześcioma wiernymi i zakłada własną nację, która od razu ma urazę do dawnej.',"To jest twoje główne narzędzie. Wojny nie zaczyna się armią, tylko jedną myślą w jednej głowie."]},znak:{id:"znak",tytul:"Znak",rysunek:Jn,linie:["Jawny cud. Drogi — czterdzieści pięć Wiary — i widzą go wszyscy w promieniu dwudziestu sześciu kafli.",'„Objawienie" podnosi oddanie i gasi strach: modlą się gorliwiej, więc więcej Wiary wraca do ciebie.','„Panika" robi odwrotnie — rozbija oblężenie, wypędza za silną nację z cudzego terenu, ale oddanie spada.',"Po Znaku zostaje w skale świecący glif. Modlitwa przy nim liczy się podwójnie."]},skaz:{id:"skaz",tytul:"Skaź",rysunek:Vn,linie:["Ostatni czasownik zmienia krew całego gatunku i nie da się tego cofnąć.","Płacisz Krwią i Otchłanią: dotykasz jednego przedstawiciela, a zmiana idzie przez wszystkie pokolenia po nim.","Każda skaza ma cenę. Płodność skraca życie i podnosi głód. Żądza krwi daje siłę, ale oni przestają się modlić.","Ślepota spowalnia, za to każda modlitwa liczy się podwójnie. Kamienna skóra daje twardość kosztem kopania."]},spis:{id:"spis",tytul:"Spis ras i Sen",rysunek:Xt,linie:["Pod płytą leży wstęga warstw — tyle miejsca, ile zajmuje każda rasa.","Dopóki warstwy są różne, żyjesz. Gdy jedna zaczyna zjadać wstęgę, zwycięzcy przestają się bać i przestają cię potrzebować.","Wtedy Wiara i Krew wysychają, a z góry i z dołu zaczyna zsuwać się powieka. To twoja jedyna przegrana: zaśnięcie.","Dlatego cała gra polega na jednym: podtrzymuj konflikt, ale nie pozwól nikomu wyginąć."]},kronika:{id:"kronika",tytul:"Kronika",rysunek:X0,linie:["Gra przez cały czas pisze. Jedna linijka na dole mówi, co się właśnie stało i jak oni to nazwali.","Są trzy końce: zaśnięcie, albo ktoś dojdzie do twojego rdzenia i uklęknie — to wolność — albo dojdzie i nie uklęknie.","W każdym z nich zostaje po tobie kronika — spisana legenda tego, czym byłeś dla tych, którzy w tobie mieszkali.","To jest twój wynik. Teraz zejdź i zobacz, co z tobą zrobią."]}},qt=[{id:"slepota",nazwa:"ślepota",skutek:"Cały Ślepy Lud jest teraz ślepy: wolniejszy, ale każda jego modlitwa liczy się podwójnie."},{id:"plodnosc",nazwa:"płodność",skutek:"Ślepy Lud będzie rodził więcej — i żył krócej, i głodniał szybciej."},{id:"kamien",nazwa:"kamienna skóra",skutek:"Ślepy Lud stwardniał: trudniej go zabić, za to gorzej kopie i więcej je."},{id:"zadza",nazwa:"żądza krwi",skutek:"Ślepy Lud jest silniejszy i nieustraszony — ale przestał się modlić."}],q0=[{tytul:"Rozejrzyj się",wstep:"Jesteś górą. W twoich korytarzach mieszkają małe ludy — to na nich patrzysz.",przygotuj:(a,e)=>{const i=e.gniazdoGoblinow();i&&a.pokazMiejsce(i.x,i.y,14,!0)},etapy:[{tekst:"Przeciągnij płytę, żeby się rozejrzeć.",klawisz:"mysz albo palec",gest:"przeciagnij",gotowe:(a,e,i)=>(e==null?void 0:e.typ)==="kamera"&&Math.hypo
